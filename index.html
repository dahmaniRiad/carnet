}
function applyCore(m) {
  const cur = coreOf(db);
  if (canon(cur) === canon(m)) return false;
  if (canon(cur.program) !== canon(m.program) && cur.programUpdatedAt > 0) snapshot('Avant synchro');
  db.program = m.program; db.programUpdatedAt = m.programUpdatedAt;
  Object.assign(db.settings, m.settings); db.settingsUpdatedAt = m.settingsUpdatedAt;
  db.logs = m.logs; db.deletedLogs = m.deletedLogs; db.daily = m.daily; db.measures = m.measures;
  save(true);
  if (!sheet.open && view.name !== 'workout') {
    const ae = document.activeElement;
    if (ae && ae.matches && ae.matches('input, textarea, select')) syncUI(); else render(true);
  }
  return true;
}
function commitMsg(r, m) {
  if (!r) return `Première sauvegarde Carnet (${plural(m.logs.length, 'séance', 'séances')})`;
  const rmap = new Map(r.logs.map((l) => [l.id, l]));
  const added = m.logs.filter((l) => !rmap.has(l.id));
  const dfc = (ts) => new Date(ts).toLocaleDateString('fr-FR');
  if (added.length === 1) return `Séance ${added[0].name} du ${dfc(added[0].startedAt)}`;
  if (added.length > 1) return `${added.length} séances ajoutées`;
  if (m.deletedLogs.length > r.deletedLogs.length) return 'Séance supprimée de l’historique';
  const edited = m.logs.filter((l) => canon(l) !== canon(rmap.get(l.id)));
  if (edited.length === 1) return `Séance ${edited[0].name} du ${dfc(edited[0].startedAt)} modifiée`;
  if (edited.length > 1) return `${edited.length} séances modifiées`;
  const dk = Object.keys(m.daily).filter((k) => canon(m.daily[k]) !== canon(r.daily[k] || null));
  if (dk.length === 1) return `Suivi du ${dfc(parseIso(dk[0]))}`;
  if (dk.length > 1) return `Suivi quotidien (${dk.length} jours)`;
  const mk = Object.keys(m.measures).filter((k) => canon(m.measures[k]) !== canon(r.measures[k] || null));
  if (mk.length === 1) return `Mensurations ${mk[0]}${hasMeasure(m.measures[mk[0]]) ? '' : ' supprimées'}`;
  if (mk.length > 1) return 'Mensurations';
  if (canon(m.program) !== canon(r.program)) return 'Programme mis à jour';
  if (canon(m.settings) !== canon(r.settings)) return 'Réglages mis à jour';

}
async function runSync() {
  if (!syncCfg || syncBusy) return null;

  if (navigator.onLine === false) { syncCfg.errKind = 'network'; syncCfg.lastError = 'Hors ligne'; saveSyncCfg(); syncUI(); return { ok: false, kind: 'network', error: 'Hors ligne' }; }
  syncBusy = true; syncUI();
  const startRev = syncCfg.rev || 0;
  const before = db.logs.length;
  let pushed = false, changed = false;
  try {
    for (let attempt = 0; ; attempt++) {
      const remote = await ghGetFile();
      const r = remote ? remoteCore(remote.data) : null;
      const merged = mergeCore(coreOf(db), r);
      if (applyCore(merged)) changed = true;
      if (r && canon(r) === canon(merged)) break;
      const text = JSON.stringify(Object.assign({ app: 'carnet', format: 2, savedAt: new Date().toISOString(), device: deviceName() }, merged), null, 1);
      if (await ghPutFile(text, remote ? remote.sha : null, commitMsg(r, merged))) { pushed = true; break; }
      if (attempt >= 2) throw new GhError(409, 'network', 'Conflit de version, nouvel essai plus tard');

      saveSyncCfg();
    }
    return { ok: true, pushed, changed, restored: Math.max(0, db.logs.length - before) };
  } catch (e) {
    const kind = e.kind || 'network';
    if (syncCfg) { syncCfg.errKind = kind; syncCfg.lastError = e.message || 'Erreur inconnue'; saveSyncCfg(); if (kind === 'network') scheduleSync(60000); }
    return { ok: false, kind, error: e.message || 'Erreur inconnue' };
  } finally {
    syncBusy = false; syncUI();
  }
}
async function connectSync(repoIn, tokenIn) {
  const repo = String(repoIn || '').trim().replace(/^https?:\/\/(www\.)?github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
  const token = String(tokenIn || '').trim();
  if (!/^[A-Za-z0-9-]+\/[A-Za-z0-9._-]+$/.test(repo)) return { ok: false, error: 'Indique le dépôt sous la forme pseudo/nom-du-depot.' };
  if (token.length < 20) return { ok: false, error: 'Colle le jeton d’accès GitHub en entier.' };
  let res;
  try { res = await fetch(`${GH}/repos/${repo}`, { cache: 'no-store', headers: ghHeaders(false, token) }); } catch (e) { return { ok: false, error: 'Pas de connexion internet.' }; }
  if (res.status === 401) return { ok: false, error: 'Jeton invalide ou expiré.' };
  if (res.status === 404 || res.status === 403) return { ok: false, error: 'Dépôt introuvable, ou le jeton n’y a pas accès. Vérifie le nom du dépôt et les dépôts autorisés du jeton.' };
  if (!res.ok) return { ok: false, error: `GitHub a répondu ${res.status}.` };
  const info = await res.json();
  if (!info.private) return { ok: false, error: 'Ce dépôt est public : ton historique y serait visible par tout le monde. Utilise un dépôt privé.' };
  syncCfg = { repo: info.full_name || repo, token, path: 'carnet.json', branch: info.default_branch || 'main', lastSyncAt: 0, lastError: '', errKind: '', dirty: true, rev: 1 };
  saveSyncCfg();
  const r = await runSync();
  if (!r || !r.ok) {
    const err = (r && r.error) || 'Synchro impossible';
    if (r && r.kind !== 'network') { syncCfg = null; saveSyncCfg(); }
    return { ok: false, error: err };
  }
  return { ok: true, restored: r.restored };
}

      for (const v of ['mer', 'jeu']) db.program.schedule[v] = db.program.schedule[v].map((x) => (x === s.id ? null : x));
      touchProgram(); save(true); go('#/programme'); toast('Séance supprimée');
    } });
  },
  'del-log': (b) => confirmSheet({ title: 'Supprimer cette séance de l’historique ?', text: 'Elle sera aussi retirée de ta sauvegarde GitHub à la prochaine synchro.', ok: 'Supprimer la séance', onOk: () => {
    db.logs = db.logs.filter((l) => l.id !== b.dataset.id);
    if (!db.deletedLogs.includes(b.dataset.id)) db.deletedLogs.push(b.dataset.id);
    save(true); touchData(); go('#/historique'); toast('Séance supprimée');
  } }),
  'reset-program': () => confirmSheet({ title: 'Réinitialiser le programme ?', text: 'Séances et exercices reviennent à la version Riad 3.0 du PDF. Ta date de début, ton poids de départ et ton historique sont conservés.', ok: 'Réinitialiser', onOk: () => {
    snapshot('Avant réinitialisation du programme');
    const p = db.program, fresh = normProgram(riadProgram());
    fresh.startDate = p.startDate; fresh.startWeight = p.startWeight; fresh.crossDefault = p.crossDefault; fresh.crossWeeks = p.crossWeeks;
    db.program = fresh; touchProgram(); save(true); render(true); toast('Programme réinitialisé');
  } }),
  export: exportData,
  'restore-snap': (b) => restoreSnapshot(+b.dataset.i),
  wipe: () => confirmSheet({ title: 'Tout effacer sur cet appareil ?', text: 'Programme, historique et suivi seront effacés de cet appareil, et la synchro sera déconnectée. Ta sauvegarde GitHub n’est pas touchée : reconnecte-toi pour tout récupérer.', ok: 'Tout effacer', onOk: () => {
    snapshot('Avant effacement');
    syncCfg = null; saveSyncCfg();
    db = freshDB(); save(true); releaseAwake(); go('#/'); render(); toast('Données effacées sur cet appareil');
  } }),
  'sync-connect': async (b) => {
    const repo = $('#f-repo'), token = $('#f-token'), err = $('[data-sync-error]');
    b.disabled = true; b.textContent = 'Connexion…';
    const r = await connectSync(repo ? repo.value : '', token ? token.value : '');
    if (!r.ok) { b.disabled = false; b.textContent = 'Connecter et synchroniser'; if (err) { err.textContent = r.error; err.hidden = false; } return; }
    render(true);
    toast(r.restored ? `Synchro activée${NB}: ${plural(r.restored, 'séance récupérée', 'séances récupérées')}` : 'Synchro activée');
  },
  'sync-now': async () => {
    const r = await runSync();
    if (!r) return;
    toast(r.ok ? (r.restored ? plural(r.restored, 'séance récupérée', 'séances récupérées') : r.pushed ? 'Sauvegarde envoyée' : r.changed ? 'Données mises à jour depuis GitHub' : 'Déjà à jour') : `Synchro impossible${NB}: ${r.error}`);
  },
  'sync-off': () => confirmSheet({ title: 'Déconnecter cet appareil ?', text: 'La synchro s’arrête sur cet appareil. Ta sauvegarde GitHub et tes données locales sont conservées.', ok: 'Déconnecter', onOk: () => { syncCfg = null; saveSyncCfg(); render(true); toast('Synchro désactivée'); } }),
};
app.addEventListener('click', (e) => {
  const rb = e.target.closest('[data-rate]');
  if (rb) { const f = rb.dataset.rate, v = +rb.dataset.v; const cur = dayEntry(isoDay()); ciUpdate(f, cur && cur[f] === v ? null : v, true); return; }
  const st = e.target.closest('[data-step]');
  if (st) {
    const k = st.closest('[data-stepper]').dataset.stepper, d = +st.dataset.step;
    if (k === 'goal') { db.settings.weeklyGoal = clamp(db.settings.weeklyGoal + d, 1, 7); touchSettings(); save(); render(true); }
    if (k === 'defrest') { db.settings.defaultRest = clamp(db.settings.defaultRest + d * 15, 0, 600); touchSettings(); save(); st.closest('[data-stepper]').querySelector('output').textContent = fmtRest(db.settings.defaultRest); }
    if (k === 'ldur' && logDraft) {
      const L = logDraft;
      L.mins = clamp(d > 0 ? Math.floor(L.mins / 5) * 5 + 5 : Math.ceil(L.mins / 5) * 5 - 5, 5, 300);
      L.minsTouched = true; L.dirty = true;
      st.closest('[data-stepper]').querySelector('output').textContent = fmtDur(L.mins * 60);
    }
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b); }
});
app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.ci) { ciUpdate(t.dataset.ci, parseNum(t.value)); return; }
  if (t.dataset.lf && logDraft) {
    const ei = +t.dataset.le, si = +t.dataset.ls, f = t.dataset.lf;
    const ex = logDraft.exercises[ei], s = ex && ex.sets[si];
    if (!s) return;
    s[f] = parseNum(t.value); s._t = true; logDraft.typed = logDraft.dirty = true;
    /* la charge saisie devient la charge en gris des séries suivantes encore vides */
    if (f === 'w' && s.w != null && !s.tag) {
      for (let j = si + 1; j < ex.sets.length; j++) {
        const x = ex.sets[j];
        if (x.w != null || x.tag === 'backoff') break;
        if (setHasVal(x) && !x._t) continue;
        const inp = app.querySelector(`.num[data-le="${ei}"][data-ls="${j}"][data-lf="w"]`);
        if (inp) inp.placeholder = fmtIn(s.w);
      }
    }
    return;
  }
  if (t.dataset.ld === 'notes' && logDraft) { logDraft.notes = t.value; logDraft.dirty = true; return; }
  if (t.classList.contains('num') && t.dataset.f) {
    const a = db.active;
    if (!a) return;
    const ei = +t.dataset.e, si = +t.dataset.s, f = t.dataset.f;
    const ex = a.exercises[ei], s = ex && ex.sets[si];
    if (!s) return;
    s[f] = parseNum(t.value);
    if (f === 'w' && s.w != null && !s.tag) {
      for (let j = si + 1; j < ex.sets.length; j++) {
        if (ex.sets[j].w != null || ex.sets[j].tag === 'backoff') break;
        const inp = app.querySelector(`.num[data-e="${ei}"][data-s="${j}"][data-f="w"]`);
        if (inp) inp.placeholder = fmtIn(s.w);
      }
    }
    save();
    return;
  }
  if (t.dataset.bind === 'session-name') { const s = findSession(view.id); if (s) { s.name = t.value; touchProgram(); save(); } }
});
app.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.bind === 'session-plate') { const s = findSession(view.id); if (s) { s.plate = t.value; touchProgram(); save(); render(true); } return; }
  if (t.dataset.bind === 'session-name') { const s = findSession(view.id); if (s && !s.name.trim()) { s.name = 'Séance sans nom'; save(); render(true); } return; }
  if (t.dataset.change === 'progress-ex') { progressKey = t.value; render(true); return; }
  if ((t.dataset.ld === 'date' || t.dataset.ld === 'time') && logDraft) {
    const d = logDraft;
    d[t.dataset.ld] = t.value; d.dirty = true;
    /* Nouvelle séance encore vide : séance prévue ce jour-là et séries de la phase de cette date */
    if (t.dataset.ld === 'date' && !d.id && !d.typed && !d.shaped && isIsoDay(t.value)) {
      const s = (d.sessionAuto && pickable(plannedSession(t.value))) || findSession(d.sessionId);
      if (s) { setDraftSession(d, s); render(true); return; }
    }
    const box = $('[data-lweek]'); if (box) box.innerHTML = draftInfoHTML(d);
    return;
  }
  const ps = t.dataset.pset;
  if (ps === 'crossWeek') { const w = programWeek(); if (w >= 1) { if (t.value === db.program.crossDefault) delete db.program.crossWeeks[w]; else db.program.crossWeeks[w] = t.value; touchProgram(); save(true); render(true); toast(`Cross de la S${w}${NB}: ${t.value === 'mer' ? 'mercredi' : 'jeudi'}`); } return; }
  if (ps === 'crossDefault') { db.program.crossDefault = t.value === 'jeu' ? 'jeu' : 'mer'; touchProgram(); save(true); render(true); return; }
  if (ps === 'startWeight') { const v = parseNum(t.value); if (v) { db.program.startWeight = v; touchProgram(); save(true); toast('Poids de départ enregistré'); } return; }
  if (ps === 'startDate') {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.value)) return;
    const mon = isoDay(weekStart(parseIso(t.value)));
    db.program.startDate = mon; touchProgram(); save(true); render(true);
    toast(mon !== t.value ? `Début ramené au lundi ${fmtDay(parseIso(mon))}` : 'Date de début enregistrée');
    return;
  }
  if (t.name === 'unit') { db.settings.unit = t.value; touchSettings(); save(); render(true); return; }
  if (t.id === 'f-sound') { db.settings.sound = t.checked; touchSettings(); save(); if (t.checked) { unlockAudio(); setTimeout(() => beep('go'), 60); } return; }
  if (t.id === 'f-import' && t.files && t.files[0]) { importFile(t.files[0]); t.value = ''; }
});
app.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.target.classList.contains('num') || e.target.classList.contains('name-input'))) { e.preventDefault(); e.target.blur(); } });
window.addEventListener('hashchange', (e) => {
  navs++;
  fromHash = '#' + (String(e.oldURL || '').split('#')[1] || '/');
  closeSheet();
  const doit = () => { render(); window.scrollTo(0, 0); };
  if (document.startViewTransition && !reduceMotion()) {
    try { const vt = document.startViewTransition(doit); [vt.ready, vt.finished, vt.updateCallbackDone].forEach((pr) => pr && pr.catch(() => {})); } catch (e) { doit(); }
  } else doit();
});
window.addEventListener('pagehide', write);
window.addEventListener('online', () => { if (syncCfg && (syncCfg.dirty || syncCfg.errKind === 'network')) scheduleSync(800); });
let renderedDay = isoDay();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { write(); return; }
  keepAwake(); tick();
  if (renderedDay !== isoDay() && view.name !== 'workout' && !sheet.open) { renderedDay = isoDay(); render(true); }
  if (syncCfg && (syncCfg.dirty || syncCfg.errKind === 'network' || Date.now() - (syncCfg.lastSyncAt || 0) > 15 * 60e3)) scheduleSync(800);
});
function tick() {
  if (!db.active) return;
  const el = document.getElementById('elapsed');
  if (el) el.textContent = fmtElapsed((Date.now() - db.active.startedAt) / 1000);
  if (db.active.timer) timerUI();
}

/* ============ Démarrage ============ */
db = load();
buildTabs();
if (!location.hash) history.replaceState(null, '', '#/');
render();
setInterval(tick, 250);
keepAwake();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* */ }
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.self === window.top) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
if (syncCfg) scheduleSync(1500);

})();
</script>
</body>
</html>
