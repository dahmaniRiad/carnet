/* ============ Sauvegardes : fichier et versions de secours ============ */
const coreRaw = (d) => ({ program: d.program, programUpdatedAt: d.programUpdatedAt, settings: d.settings, settingsUpdatedAt: d.settingsUpdatedAt, logs: d.logs, deletedLogs: d.deletedLogs, daily: d.daily, measures: d.measures });
function snapshots() { try { const l = JSON.parse(store.get(SNAP_KEY) || '[]'); return Array.isArray(l) ? l : []; } catch (e) { return []; } }
function snapshot(reason) {
  try {
    const list = snapshots();
    list.unshift({ at: Date.now(), reason, n: db.logs.length, data: JSON.stringify(coreRaw(db)) });
    store.set(SNAP_KEY, JSON.stringify(list.slice(0, 5)));
  } catch (e) { /* stockage plein : on n’empêche pas l’action */ }
}
function restoreSnapshot(i) {
  const s = snapshots()[i];
  if (!s) return;
  confirmSheet({ title: 'Restaurer cette version ?', text: `Version «${NB}${s.reason}${NB}» (${plural(s.n, 'séance', 'séances')}). Tes données actuelles sont gardées dans une nouvelle version de secours.`, ok: 'Restaurer cette version', danger: false, onOk: () => {
    let d;
    try { d = JSON.parse(s.data); } catch (e) { toast('Cette version est illisible'); return; }
    snapshot('Avant restauration');
    const nd = migrate(Object.assign(d, { active: db.active }));
    nd.settings.hideInstall = db.settings.hideInstall;
    nd.programUpdatedAt = Date.now(); nd.settingsUpdatedAt = Date.now();
    db = nd; save(true); markDirty(800); render(); toast('Version restaurée');
  } });
}
async function exportData() {
  const payload = Object.assign({ app: 'carnet', version: 2, exportedAt: new Date().toISOString() }, coreRaw(db));
  const name = `carnet-sauvegarde-${isoDay()}.json`;
  const json = JSON.stringify(payload, null, 1);
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Sauvegarde Carnet' }); toast('Sauvegarde exportée'); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const link = document.createElement('a');
    link.href = url; link.download = name; document.body.appendChild(link); link.click();
    setTimeout(() => { URL.revokeObjectURL(url); link.remove(); }, 1500);
    toast('Sauvegarde exportée');
  } catch (e) { toast('Export impossible sur cet appareil'); }
}
function importFile(file) {
  const r = new FileReader();
  r.onload = () => {
    let d = null;
    try { d = JSON.parse(String(r.result)); } catch (e) { d = null; }
    if (!d || typeof d !== 'object' || !(Array.isArray(d.logs) || d.daily || d.program)) { toast('Fichier non reconnu. Choisis une sauvegarde exportée depuis l’app.'); return; }
    const nd = migrate(Object.assign({}, d, { active: null }));
    confirmSheet({
      title: 'Remplacer tes données ?',
      text: `La sauvegarde contient ${plural(nd.logs.length, 'séance', 'séances')}, ${plural(Object.keys(nd.daily).length, 'jour', 'jours')} de suivi et ${plural(nd.program.sessions.length, 'séance', 'séances')} au programme. Tes données actuelles seront gardées dans une version de secours.`,
      ok: 'Importer la sauvegarde', danger: false,
      onOk: () => { snapshot('Avant import'); nd.programUpdatedAt = Date.now(); nd.settingsUpdatedAt = Date.now(); db = nd; save(true); markDirty(800); render(); toast('Sauvegarde importée'); },
    });
  };
  r.onerror = () => toast('Lecture du fichier impossible');
  r.readAsText(file);
}

/* ============ Synchro GitHub (dépôt privé, une version par synchro) ============ */
const GH = 'https://api.github.com';
let syncCfg = loadSyncCfg();
let syncBusy = false, syncTimer = null;
function loadSyncCfg() {
  try { const s = JSON.parse(store.get(SYNC_KEY) || 'null'); if (s && s.repo && s.token) return Object.assign({ path: 'carnet.json', branch: 'main', lastSyncAt: 0, lastError: '', errKind: '', dirty: false, rev: 0 }, s); } catch (e) { /* */ }
  return null;
}
function saveSyncCfg() { if (syncCfg) store.set(SYNC_KEY, JSON.stringify(syncCfg)); else store.del(SYNC_KEY); }
function syncState() {
  if (!syncCfg) return 'off';
  if (syncBusy) return 'busy';
  if (syncCfg.errKind === 'auth' || syncCfg.errKind === 'fatal') return 'error';
  if (syncCfg.dirty || syncCfg.errKind === 'network') return 'pending';
  return 'ok';
}
function markDirty(delay) {
  if (!syncCfg) return;
  syncCfg.dirty = true; syncCfg.rev = (syncCfg.rev || 0) + 1;
  saveSyncCfg(); syncUI();
  scheduleSync(delay == null ? 4000 : delay);
}
function scheduleSync(ms) { if (!syncCfg) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => { runSync(); }, ms); }
function syncUI() {
  const st = syncState();
  $$('[data-sync-chip]').forEach((el) => { el.className = 'sync-chip ' + st; el.setAttribute('aria-label', `Sauvegarde${NB}: ${syncLabel(st)}`); });
  const box = $('[data-sync-status]');
  if (box) box.innerHTML = syncStatusHTML(st);
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
class GhError extends Error { constructor(status, kind, msg) { super(msg); this.status = status; this.kind = kind; } }
const ghHeaders = (json, token) => {
  const h = { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + (token || syncCfg.token), 'X-GitHub-Api-Version': '2022-11-28' };
  if (json) h['Content-Type'] = 'application/json';
  return h;
};
async function ghFetch(url, opts) {
  try { return await fetch(url, Object.assign({ cache: 'no-store' }, opts)); } catch (e) { throw new GhError(0, 'network', 'Pas de connexion internet'); }
}
async function ghFail(res) {
  let msg = '';
  try { const j = await res.json(); msg = (j && j.message) || ''; } catch (e) { /* */ }
  if (res.status === 401) return new GhError(401, 'auth', 'Jeton invalide ou expiré. Déconnecte cet appareil puis reconnecte-le avec un nouveau jeton.');
  if (res.status === 403 && res.headers.get('x-ratelimit-remaining') === '0') return new GhError(403, 'network', 'Limite de requêtes GitHub atteinte');
  if (res.status === 403) return new GhError(403, 'auth', 'Le jeton n’a pas le droit d’écrire dans ce dépôt (permission Contents en lecture et écriture).');
  if (res.status === 404) return new GhError(404, 'auth', 'Dépôt introuvable, ou le jeton n’y a pas accès.');
  if (res.status >= 500) return new GhError(res.status, 'network', 'GitHub ne répond pas');
  return new GhError(res.status, 'fatal', `Erreur GitHub ${res.status}${msg ? ` (${msg})` : ''}`);
}
const contentsUrl = () => `${GH}/repos/${syncCfg.repo}/contents/${syncCfg.path.split('/').map(encodeURIComponent).join('/')}`;
async function ghGetFile() {
  const res = await ghFetch(contentsUrl(), { headers: ghHeaders() });
  if (res.status === 404) return null;
  if (!res.ok) throw await ghFail(res);
  const j = await res.json();
  let text;
  if (j.content && j.encoding === 'base64') text = b64decode(String(j.content).replace(/\s/g, ''));
  else {
    const raw = await ghFetch(contentsUrl(), { headers: Object.assign(ghHeaders(), { Accept: 'application/vnd.github.raw+json' }) });
    if (!raw.ok) throw await ghFail(raw);
    text = await raw.text();
  }
  try { return { sha: j.sha, data: JSON.parse(text) }; } catch (e) { throw new GhError(0, 'fatal', 'Le fichier carnet.json du dépôt est illisible'); }
}
async function ghPutFile(text, sha, message) {
  const body = { message, content: b64encode(text) };
  if (sha) body.sha = sha;
  const res = await ghFetch(contentsUrl(), { method: 'PUT', headers: ghHeaders(true), body: JSON.stringify(body) });
  if (res.ok) return true;
  if (res.status === 409 || res.status === 422) return false;
  throw await ghFail(res);
}
const SYNC_SETTINGS = ['unit', 'weeklyGoal', 'sound', 'defaultRest'];
function coreOf(d) {
  const st = {};
  SYNC_SETTINGS.forEach((k) => { st[k] = d.settings[k]; });
  const del = [...new Set((d.deletedLogs || []).map(String))].sort();
  const ds = new Set(del);
  return {
    program: normProgram(d.program), programUpdatedAt: +d.programUpdatedAt || 0, settings: st, settingsUpdatedAt: +d.settingsUpdatedAt || 0,
    logs: (d.logs || []).filter((l) => !ds.has(String(l.id))).map(normLog).sort(logOrder), deletedLogs: del,
    daily: normDaily(d.daily), measures: normMeasures(d.measures),
  };
}
const remoteCore = (raw) => coreOf(migrate(Object.assign({}, raw, { active: null })));
function mergeCore(l, r) {
  if (!r) return l;
  const del = new Set([...l.deletedLogs, ...r.deletedLogs]);
  const map = new Map();
  for (const x of r.logs) if (!del.has(x.id)) map.set(x.id, x);
  for (const x of l.logs) if (!del.has(x.id)) map.set(x.id, x);
  const pickP = l.programUpdatedAt > r.programUpdatedAt || (l.programUpdatedAt === r.programUpdatedAt && canon(l.program) <= canon(r.program));
  const pickS = l.settingsUpdatedAt > r.settingsUpdatedAt || (l.settingsUpdatedAt === r.settingsUpdatedAt && canon(l.settings) <= canon(r.settings));
  const mergeMap = (a, b) => {
    const o = {};
    for (const k of [...new Set([...Object.keys(a), ...Object.keys(b)])].sort()) { const x = a[k], y = b[k]; o[k] = !x ? y : !y ? x : (x.at || 0) >= (y.at || 0) ? x : y; }
    return o;
  };
  return {
    program: pickP ? l.program : r.program, programUpdatedAt: Math.max(l.programUpdatedAt, r.programUpdatedAt),
    settings: pickS ? l.settings : r.settings, settingsUpdatedAt: Math.max(l.settingsUpdatedAt, r.settingsUpdatedAt),
    logs: [...map.values()].sort(logOrder), deletedLogs: [...del].sort(),
    daily: mergeMap(l.daily, r.daily), measures: mergeMap(l.measures, r.measures),
  };
}
function applyCore(m) {
  const cur = coreOf(db);
  if (canon(cur) === canon(m)) return false;
  if (canon(cur.program) !== canon(m.program) && cur.programUpdatedAt > 0) snapshot('Avant synchro');
  db.program = m.program; db.programUpdatedAt = m.programUpdatedAt;
  Object.assign(db.settings, m.settings); db.settingsUpdatedAt = m.settingsUpdatedAt;
  db.logs = m.logs; db.deletedLogs = m.deletedLogs; db.daily = m.daily; db.measures = m.measures;
  save(true);
  if (!sheet.open && view.name !== 'workout') {
    const ae = document.activeElement;
    if (ae && ae.matches && ae.matches('input, textarea, select')) syncUI(); else render(true);
  }
  return true;
}
function commitMsg(r, m) {
  if (!r) return `Première sauvegarde Carnet (${plural(m.logs.length, 'séance', 'séances')})`;
  const rids = new Set(r.logs.map((l) => l.id));
  const added = m.logs.filter((l) => !rids.has(l.id));
  const dfc = (ts) => new Date(ts).toLocaleDateString('fr-FR');
  if (added.length === 1) return `Séance ${added[0].name} du ${dfc(added[0].startedAt)}`;
  if (added.length > 1) return `${added.length} séances ajoutées`;
  if (m.deletedLogs.length > r.deletedLogs.length) return 'Séance supprimée de l’historique';
  const dk = Object.keys(m.daily).filter((k) => canon(m.daily[k]) !== canon(r.daily[k] || null));
  if (dk.length === 1) return `Suivi du ${dfc(parseIso(dk[0]))}`;
  if (dk.length > 1) return `Suivi quotidien (${dk.length} jours)`;
  if (canon(m.measures) !== canon(r.measures)) return 'Mensurations';
  if (canon(m.program) !== canon(r.program)) return 'Programme mis à jour';
  if (canon(m.settings) !== canon(r.settings)) return 'Réglages mis à jour';
  return 'Synchro Carnet';
}
async function runSync() {
  if (!syncCfg || syncBusy) return null;

  if (navigator.onLine === false) { syncCfg.errKind = 'network'; syncCfg.lastError = 'Hors ligne'; saveSyncCfg(); syncUI(); return { ok: false, kind: 'network', error: 'Hors ligne' }; }
  syncBusy = true; syncUI();
  const startRev = syncCfg.rev || 0;
  const before = db.logs.length;

  if (reduceMotion()) return;

  const ctx = cv.getContext('2d');

    return { x: ox, y: oy, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, r: 3 + Math.random() * 5, disc: Math.random() < 0.6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: colors[(Math.random() * colors.length) | 0] };

    let alive = 0;
    for (const p of parts) {
      p.vy += 0.33; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (alpha <= 0 || p.y > innerHeight + 20) continue;
      alive++;

}

    toast(r.ok ? (r.restored ? plural(r.restored, 'séance récupérée', 'séances récupérées') : r.pushed ? 'Sauvegarde envoyée' : r.changed ? 'Données mises à jour depuis GitHub' : 'Déjà à jour') : `Synchro impossible${NB}: ${r.error}`);
  },
  'sync-off': () => confirmSheet({ title: 'Déconnecter cet appareil ?', text: 'La synchro s’arrête sur cet appareil. Ta sauvegarde GitHub et tes données locales sont conservées.', ok: 'Déconnecter', onOk: () => { syncCfg = null; saveSyncCfg(); render(true); toast('Synchro désactivée'); } }),
};
app.addEventListener('click', (e) => {
  const rb = e.target.closest('[data-rate]');
  if (rb) { const f = rb.dataset.rate, v = +rb.dataset.v; const cur = dayEntry(isoDay()); ciUpdate(f, cur && cur[f] === v ? null : v, true); return; }
  const st = e.target.closest('[data-step]');
  if (st) {
    const k = st.closest('[data-stepper]').dataset.stepper, d = +st.dataset.step;
    if (k === 'goal') { db.settings.weeklyGoal = clamp(db.settings.weeklyGoal + d, 1, 7); touchSettings(); save(); render(true); }
    if (k === 'defrest') { db.settings.defaultRest = clamp(db.settings.defaultRest + d * 15, 0, 600); touchSettings(); save(); st.closest('[data-stepper]').querySelector('output').textContent = fmtRest(db.settings.defaultRest); }
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b); }
});
app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.ci) { ciUpdate(t.dataset.ci, parseNum(t.value)); return; }
  if (t.classList.contains('num') && t.dataset.f) {
    const a = db.active;
    if (!a) return;
    const ei = +t.dataset.e, si = +t.dataset.s, f = t.dataset.f;
    const ex = a.exercises[ei], s = ex && ex.sets[si];
    if (!s) return;
    s[f] = parseNum(t.value);
    if (f === 'w' && s.w != null && !s.tag) {
      for (let j = si + 1; j < ex.sets.length; j++) {
        if (ex.sets[j].w != null || ex.sets[j].tag === 'backoff') break;
        const inp = app.querySelector(`.num[data-e="${ei}"][data-s="${j}"][data-f="w"]`);
        if (inp) inp.placeholder = fmtIn(s.w);
      }
    }
    save();
    return;
  }
  if (t.dataset.bind === 'session-name') { const s = findSession(view.id); if (s) { s.name = t.value; touchProgram(); save(); } }
});
app.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.bind === 'session-plate') { const s = findSession(view.id); if (s) { s.plate = t.value; touchProgram(); save(); render(true); } return; }
  if (t.dataset.bind === 'session-name') { const s = findSession(view.id); if (s && !s.name.trim()) { s.name = 'Séance sans nom'; save(); render(true); } return; }
  if (t.dataset.change === 'progress-ex') { progressKey = t.value; render(true); return; }
  const ps = t.dataset.pset;
  if (ps === 'crossWeek') { const w = programWeek(); if (w >= 1) { if (t.value === db.program.crossDefault) delete db.program.crossWeeks[w]; else db.program.crossWeeks[w] = t.value; touchProgram(); save(true); render(true); toast(`Cross de la S${w}${NB}: ${t.value === 'mer' ? 'mercredi' : 'jeudi'}`); } return; }
  if (ps === 'crossDefault') { db.program.crossDefault = t.value === 'jeu' ? 'jeu' : 'mer'; touchProgram(); save(true); render(true); return; }
  if (ps === 'startWeight') { const v = parseNum(t.value); if (v) { db.program.startWeight = v; touchProgram(); save(true); toast('Poids de départ enregistré'); } return; }
  if (ps === 'startDate') {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.value)) return;
    const mon = isoDay(weekStart(parseIso(t.value)));
    db.program.startDate = mon; touchProgram(); save(true); render(true);
    toast(mon !== t.value ? `Début ramené au lundi ${fmtDay(parseIso(mon))}` : 'Date de début enregistrée');
    return;
  }
  if (t.name === 'unit') { db.settings.unit = t.value; touchSettings(); save(); render(true); return; }
  if (t.id === 'f-sound') { db.settings.sound = t.checked; touchSettings(); save(); if (t.checked) { unlockAudio(); setTimeout(() => beep('go'), 60); } return; }
  if (t.id === 'f-import' && t.files && t.files[0]) { importFile(t.files[0]); t.value = ''; }
});
app.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.target.classList.contains('num') || e.target.classList.contains('name-input'))) { e.preventDefault(); e.target.blur(); } });
window.addEventListener('hashchange', () => {
  closeSheet();
  const doit = () => { render(); window.scrollTo(0, 0); };
  if (document.startViewTransition && !reduceMotion()) {
    try { const vt = document.startViewTransition(doit); [vt.ready, vt.finished, vt.updateCallbackDone].forEach((pr) => pr && pr.catch(() => {})); } catch (e) { doit(); }
  } else doit();
});
window.addEventListener('pagehide', write);
window.addEventListener('online', () => { if (syncCfg && (syncCfg.dirty || syncCfg.errKind === 'network')) scheduleSync(800); });
let renderedDay = isoDay();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { write(); return; }
  keepAwake(); tick();
  if (renderedDay !== isoDay() && view.name !== 'workout' && !sheet.open) { renderedDay = isoDay(); render(true); }
  if (syncCfg && (syncCfg.dirty || syncCfg.errKind === 'network' || Date.now() - (syncCfg.lastSyncAt || 0) > 15 * 60e3)) scheduleSync(800);
});
function tick() {
  if (!db.active) return;
  const el = document.getElementById('elapsed');
  if (el) el.textContent = fmtElapsed((Date.now() - db.active.startedAt) / 1000);
  if (db.active.timer) timerUI();
}

/* ============ Démarrage ============ */
db = load();
buildTabs();
if (!location.hash) history.replaceState(null, '', '#/');
render();
setInterval(tick, 250);
keepAwake();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* */ }
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.self === window.top) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
if (syncCfg) scheduleSync(1500);

})();
</script>
</body>
</html>
