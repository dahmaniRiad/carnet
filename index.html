  } else {
    const restNote = dow === 6 ? 'Batch cooking du dimanche.' : 'Marche 20-30 min et mini-batch cooking.';
    main = `<section class="card main-card" style="${pvars(missed[0] ? missed[0].plate : 'gris')}">
      <p class="mc-label">${dayLabel}</p>
      <div class="next-row"><span class="disc lg" style="${pvars('gris')}">${I.bed}</span><div><h2 class="next-name">Repos</h2><p class="muted">${restNote}</p></div></div>
      ${missed.length ? `${phaseNote(null, `${missed.length > 1 ? 'Séances à rattraper' : 'Séance à rattraper'} cette semaine. Décale-la, ne double jamais.`)}<div class="stack">${missed.map((s) => `<button class="btn primary" style="${pvars(s.plate)}" data-act="start" data-id="${esc(s.id)}">Rattraper ${esc(s.name)}</button>`).join('')}</div>` : `<p class="muted">${upcoming ? `Prochaine séance${NB}: ${esc(upcoming.name)}, ${DOW[ids.indexOf(upcoming.id)]}.` : 'Profite de la récup.'}</p>`}
    </section>`;
  }
  const others = a ? [] : db.program.sessions.filter((s) => s.kind === 'muscu' && s.exercises.length && (!today || s.id !== today.id) && !(missed.includes(s) && !today));
  const othersHTML = others.length ? `<div class="others"><p class="muted small">Faire une autre séance</p><div class="chips">${others.map((s) => `<button class="chip" data-act="start" data-id="${esc(s.id)}">${disc(s.plate, s.code, 'sm')}${esc(s.name)}${missed.includes(s) ? '<span class="faint small">à rattraper</span>' : ''}</button>`).join('')}</div></div>` : '';
  const install = isIOS && !isStandalone() && !db.settings.hideInstall
    ? `<div class="card note"><p><strong>Installe l’app sur ton iPhone.</strong> Dans Safari, ouvre le menu Partager puis «${NB}Sur l’écran d’accueil${NB}». Fais-le avant de commencer${NB}: l’app installée ne reprend pas forcément les données saisies dans Safari.</p><button class="link-btn" data-act="hide-install">Masquer</button></div>` : '';
  const nudge = !syncCfg && (db.logs.length || Object.keys(db.daily).length) && Date.now() > (db.settings.nudgeAfter || 0)
    ? `<section class="card nudge" style="${pvars('bleu')}"><span class="ic">${I.shield}</span><div class="grow"><p class="h3">Protège ton historique</p><p class="muted small" style="margin-top:2px">Active la sauvegarde automatique sur GitHub pour tout retrouver, même après une réinstallation.</p><div class="row-btns"><a class="btn sm primary" href="#/reglages">Activer</a><button class="link-btn muted" data-act="hide-nudge">Plus tard</button></div></div></section>` : '';
  const pill = w >= 1 ? `<a class="phase-pill" href="#/programme" style="--phc:${ph.color}"><b>S${w}</b>${esc(ph.label)}</a>` : `<a class="phase-pill" href="#/programme" style="--phc:${ph.color}"><b>S1</b>Début le ${fmtDay(programStart())}</a>`;
  const reached = info.logs.length >= goal;
  return `${install}
  <header class="top" style="margin-bottom:10px"><div><p class="kicker">${cap(dfLong.format(new Date()))}</p><h1 class="title">Aujourd’hui</h1></div><div class="top-actions">${syncChip()}<a class="icon-btn glassy" href="#/reglages" aria-label="Réglages">${I.gear}</a></div></header>
  <div class="pill-row">${pill}${coachHomePill()}</div>
  <section class="week">
    <div class="week-line"><h2 class="h2">Cette semaine</h2><p class="week-count">${info.logs.length} sur ${goal}${reached ? '<span class="badge-ok">Objectif atteint</span>' : ''}</p></div>
    ${weekBar(info.logs, goal, nextPlate)}
    ${daysRow(info)}
  </section>
  ${main}
  ${othersHTML}
  ${checkinCard()}
  ${nutritionCard(info)}
  ${coachHomeCard()}
  ${nudge}
  ${last ? `<section class="card sec"><p class="mc-label">Dernière séance</p><ul class="rows" style="margin-top:4px"><li><a class="row" href="#/historique/${encodeURIComponent(last.id)}">${disc(last.plate, last.code || '', 'sm')}<span class="grow"><span class="name">${esc(last.name)}</span><span class="sub">${cap(relDay(last.startedAt))}, ${fmtDur(last.duration)}${last.kind === 'cross' ? '' : `, ${plural(countSets(last), 'série', 'séries')}`}</span></span>${I.chev}</a></li></ul></section>` : ''}`;
}

/* ============ Programme ============ */

  const legend = [PHASES.s1, PHASES.b1, PHASES.deload, PHASES.b2].map((x) => `<span style="--phc:${x.color}">${esc(x.tag)}</span>`).join('');
  const plan = info.ids.map((sid, i) => { const s = sid && findSession(sid); return `<li class="${i === info.dow ? 'today' : ''}"><span class="d">${cap(DOW[i]).slice(0, 3)}.</span>${s ? `${disc(s.plate, s.code, 'sm')}<span>${esc(s.name)}${s.kind === 'cross' && ph.sets === 'deload' ? ' léger' : ''}</span>` : '<span class="faint">Repos</span>'}</li>`; }).join('');

    <div class="tl">${tl}</div>

  </section>
  <section class="card sec" style="${pvars('bleu')}">
    <div class="card-head"><h2 class="h2">Cette semaine</h2><p class="muted small">${w >= 1 ? 'S' + w : ''}</p></div>
    <p class="small muted" style="margin:6px 0 8px">Jour du cross</p>
    ${seg('crossweek', info.variant, 'crossWeek')}
    <ul class="plan">${plan}</ul>
  </section>
  <div class="sec-head"><h2 class="h2">Séances</h2></div>
  <div class="card"><ul class="rows">${p.sessions.map((s) => `<li><a class="row" href="#/programme/${encodeURIComponent(s.id)}">${disc(s.plate, s.code)}<span class="grow"><span class="name">${esc(s.name)}${s.optional ? ' (option)' : ''}</span><span class="sub">${esc(s.focus)}${s.kind === 'muscu' ? `, ≈${NB}${s.minutes}${NB}min, ${sessionSets(s, ph)} séries` : ''}</span></span>${I.chev}</a></li>`).join('')}</ul></div>
  <button class="btn quiet add" data-act="add-session">${I.plus} Ajouter une séance</button>
  <div class="sec-head"><h2 class="h2">Règles de séance</h2></div>
  <div class="card">${RULES.map(([t, d]) => `<details class="rule"><summary>${esc(t)}</summary><p>${esc(d)}</p></details>`).join('')}</div>
  <div class="sec-head"><h2 class="h2">Paramètres</h2></div>
  <section class="card" style="${pvars('bleu')}">
    <label class="field" style="margin-top:0"><span>Début du programme (lundi de la S1)</span><input class="input" type="date" data-pset="startDate" value="${esc(p.startDate)}"></label>
    <label class="field"><span>Poids de départ</span><span class="ci-in"><input class="input" type="text" inputmode="decimal" data-pset="startWeight" value="${fmtIn(p.startWeight)}" placeholder="80" style="padding-right:40px"><em>kg</em></span></label>
    <div class="field"><span>Cross par défaut</span>${seg('crossdef', p.crossDefault, 'crossDefault')}</div>
    <div class="goal" style="margin-top:18px"><div><p class="h3">Objectif</p><p class="muted small">Séances par semaine, cross compris</p></div>${stepperHTML('goal', String(db.settings.weeklyGoal), true, 'l’objectif de séances')}</div>
    <div class="stack"><button class="btn danger-line" data-act="reset-program">Réinitialiser le programme Riad 3.0</button></div>
  </section>`;
}
function programTarget(e, prev, next) {
  const sets = e.sets2 && e.sets2 !== e.sets ? `${e.sets}→${e.sets2}` : `${e.sets}`;
  const reps = e.type === 'duree' ? `${fmtN(e.time)}${e.timeMax ? '-' + fmtN(e.timeMax) : ''}${NB}s` : e.type === 'cardio' ? '' : e.reps || 'max';
  return `${sets}${NB}×${NB}${esc(reps)}${e.perSide ? ' par ' + esc(e.perSide) : ''}${e.backoff ? ' (+1 back-off en bloc 2)' : ''}${e.rir ? `, RIR ${esc(e.rir)}` : ''}, ${restText(e, prev, next)}`;
}
function viewSession() {
  const s = findSession(view.id);

  const exs = s.exercises;
  return `<div style="${pvars(s.plate)}">
  <a class="back" href="#/programme">${I.back} Programme</a>
  <header class="s-head">${disc(s.plate, s.code, 'lg')}<label class="grow"><span class="sr">Nom de la séance</span><input class="name-input" data-bind="session-name" value="${esc(s.name)}" placeholder="Nom de la séance" maxlength="40" autocomplete="off" enterkeyhint="done"></label></header>
  <p class="muted">${esc(s.focus)}${s.kind === 'muscu' && exs.length ? `, ≈${NB}${s.minutes}${NB}min, ${sessionSets(s, PHASES.b1)} séries en bloc 1, ${sessionSets(s, PHASES.b2)} en bloc 2` : ''}</p>
  ${s.notes ? `<p class="phase-note" style="margin-top:12px;--phc:${plateOf(s.plate).hi}">${I.info}<span>${esc(s.notes)}</span></p>` : ''}
  <fieldset class="plates" style="margin-top:16px"><legend>Couleur du disque</legend>${PLATE_KEYS.map((k) => `<label class="pl"><input type="radio" name="plate" value="${k}" ${s.plate === k ? 'checked' : ''} data-bind="session-plate"><span class="disc" style="${pvars(k)}"></span><span class="sr">${PLATES[k].label}</span></label>`).join('')}</fieldset>
  ${s.kind === 'cross' ? '' : `<div class="sec-head"><h2 class="h2">Exercices</h2><p class="muted small">Séries bloc 1 → bloc 2</p></div>
  ${exs.length ? `<div class="card"><ol class="rows">${exs.map((e, i) => `<li class="row ex-row">${e.code ? `<span class="code">${esc(e.code)}</span>` : ''}<button class="grow ex-open" data-act="edit-ex" data-i="${i}"><span class="name">${esc(e.name)}</span><span class="sub">${programTarget(e, exs[i - 1], exs[i + 1])}</span></button><span class="mv"><button class="icon-btn sm" data-act="move-ex" data-i="${i}" data-d="-1" aria-label="Monter ${esc(e.name)}" ${i === 0 ? 'disabled' : ''}>${I.up}</button><button class="icon-btn sm" data-act="move-ex" data-i="${i}" data-d="1" aria-label="Descendre ${esc(e.name)}" ${i === exs.length - 1 ? 'disabled' : ''}>${I.down}</button></span></li>`).join('')}</ol></div>` : '<div class="card empty"><p class="muted">Aucun exercice pour l’instant.</p></div>'}
  <button class="btn quiet add" data-act="add-ex">${I.plus} Ajouter un exercice</button>`}
  <div class="stack" style="margin-top:28px">
    ${s.kind === 'cross' ? `<button class="btn primary" data-act="cross" data-id="${esc(s.id)}">Marquer le cross comme fait</button>` : `<button class="btn primary" data-act="start" data-id="${esc(s.id)}" ${exs.length ? '' : 'disabled'}>Démarrer cette séance</button>`}
    <button class="btn danger-line" data-act="del-session">Supprimer la séance</button>

/* ============ Séance en cours ============ */
function setRow(ex, ei, s, si, prog, cls, isNext) {
  const ph = placeholders(ex, si, prog);
  const f = (field, mode, label, val, plh) => `<input class="num" type="text" inputmode="${mode}" autocomplete="off" enterkeyhint="done" data-e="${ei}" data-s="${si}" data-f="${field}" value="${fmtIn(val)}" placeholder="${fmtIn(plh)}" aria-label="${label}, ${esc(ex.name)}, série ${si + 1}">`;
  let inputs;
  if (ex.type === 'charge') inputs = f('w', 'decimal', `Charge en ${unit()}`, s.w, ph.w) + f('r', 'numeric', 'Répétitions', s.r, ph.r);
  else if (ex.type === 'reps') inputs = f('r', 'numeric', 'Répétitions', s.r, ph.r);
  else if (ex.type === 'duree') inputs = f('t', 'numeric', 'Durée en secondes', s.t, ph.t) + `<button class="ok play" data-act="play" data-e="${ei}" data-s="${si}" aria-label="Lancer le chrono de la série ${si + 1}" ${s.done ? 'disabled' : ''}>${I.play}</button>`;
  else inputs = f('d', 'decimal', 'Distance en km', s.d, ph.d) + f('t', 'decimal', 'Durée en minutes', s.t, ph.t);
  const just = justChecked === ei + ':' + si;
  const tag = s.tag === 'backoff' ? `<p class="set-tag">Back-off${NB}: −25${NB}% pour 12-15 reps</p>` : s.tag === 'drop' ? `<p class="set-tag">Dernière série en drop set${NB}: −25-30${NB}%, sans repos</p>` : '';
  const row = `<div class="set ${cls} ${s.done ? 'done' : ''} ${isNext ? 'next' : ''} ${just ? 'flash' : ''}"><span class="set-n" aria-hidden="true">${s.tag === 'backoff' ? 'B' : si + 1}</span>${inputs}<button class="ok chk ${just ? 'just' : ''}" data-act="check" data-e="${ei}" data-s="${si}" aria-pressed="${s.done}" aria-label="${s.done ? 'Annuler la validation de' : 'Valider'} la série ${si + 1}">${I.check}</button></div>`;
  let drop = '';
  if (s.tag === 'drop' && ex.type === 'charge') {
    const base = s.w != null ? s.w : ph.w;
    const dwp = base != null ? roundTo(base * 0.72, (STEPS[ex.step] || STEPS.machine).round) : null;
    drop = `<div class="set drop-row"><span class="set-n">Drop</span>${f('dw', 'decimal', `Charge du drop en ${unit()}`, s.dw, dwp)}${f('dr', 'numeric', 'Répétitions du drop', s.dr, null)}<span></span></div>`;
  }
  return tag + row + drop;
}
function targetLine(ex, a, ei) {
  const t = ex.target, n = ex.sets.filter((s) => s.tag !== 'backoff').length;
  const prev = a.exercises[ei - 1], next = a.exercises[ei + 1];
  let core;
  if (ex.type === 'duree') core = `${n}${NB}×${NB}${fmtN(t.time)}${t.timeMax ? '-' + fmtN(t.timeMax) : ''}${NB}s`;
  else if (ex.type === 'cardio') core = [t.dist != null ? `${fmtN(t.dist)}${NB}km` : '', t.time != null ? `${fmtN(t.time)}${NB}min` : ''].filter(Boolean).join(' en ') || 'Distance libre';
  else core = `${n}${NB}×${NB}${esc(t.reps || 'max')}${ex.perSide ? ' par ' + esc(ex.perSide) : ''}${t.backoff ? ' + 1 back-off' : ''}`;
  return `${core}${t.rir ? `, RIR ${esc(t.rir)}` : ''}, ${restText(ex, prev, next)}`;
}
function exerciseBlock(ei, a, ph, nx, inGroup) {
  const ex = a.exercises[ei];
  const done = ex.sets.length > 0 && ex.sets.every((s) => s.done);
  const isCur = !!nx && nx.ei === ei;
  if (done && !expanded.has(ei)) {
    return `<section class="ex ${inGroup ? '' : 'card'} done ${justDoneEi === ei ? 'just-done' : ''}" id="ex-${ei}"><button class="ex-sum" data-act="expand" data-e="${ei}" aria-expanded="false"><span class="ex-ok">${I.check}</span>${ex.code ? `<span class="code ghost">${esc(ex.code)}</span>` : ''}<span class="grow"><span class="ex-name" style="display:block">${esc(ex.name)}</span><span class="muted small">${perfText({ type: ex.type, sets: ex.sets })}</span></span>${I.chev}</button></section>`;
  }
  const prog = progressionFor(ex, ph, a.startedAt);
  const heads = { charge: [ex.step === 'lest' ? `Lest ${unit()}` : unit(), ex.perSide ? 'Rép./' + ex.perSide : 'Rép.'], reps: [ex.perSide ? 'Rép./' + ex.perSide : 'Rép.'], duree: ['Secondes', ''], cardio: ['km', 'Minutes'] }[ex.type] || [];
  const cls = ex.type === 'reps' ? 'c1' : ex.type === 'duree' ? 'c1p' : '';
  const lastSet = ex.sets[ex.sets.length - 1];
  const icon = prog.kind === 'up' ? I.trend : prog.kind === 'warn' ? I.alert : I.info;
  const more = ex.cues || ex.alt || ex.notes ? `<details class="ex-more"><summary>Consignes</summary>${ex.cues ? `<p>${esc(ex.cues)}</p>` : ''}${ex.alt ? `<p>Alternative${NB}: ${esc(ex.alt)}</p>` : ''}${ex.notes ? `<p>${esc(ex.notes)}</p>` : ''}</details>` : '';
  return `<section class="ex ${inGroup ? '' : 'card'} ${isCur ? 'current' : ''}" id="ex-${ei}">
    <div class="ex-top">${ex.code ? `<span class="code">${esc(ex.code)}</span>` : ''}<h2 class="ex-name grow">${esc(ex.name)}</h2>${isCur ? '<span class="chip-now">En cours</span>' : done ? `<button class="icon-btn sm" data-act="collapse" data-e="${ei}" aria-label="Replier ${esc(ex.name)}">${I.up}</button>` : ''}</div>
    <p class="ex-target">${targetLine(ex, a, ei)}</p>
    ${prog.text ? `<p class="hint-line ${prog.kind}">${icon}<span>${esc(prog.text)}</span></p>` : ''}
    ${coachExHint(a, ei)}
    ${more}
    <div class="sets">
      <div class="set head ${cls}" aria-hidden="true"><span></span>${heads.map((h) => `<span>${esc(h)}</span>`).join('')}<span></span></div>
      ${ex.sets.map((s, si) => setRow(ex, ei, s, si, prog, cls, !!nx && nx.ei === ei && nx.si === si)).join('')}
    </div>
    <div class="ex-actions"><button class="link-btn" data-act="add-set" data-e="${ei}">${I.plus} Ajouter une série</button>${ex.sets.length > 1 && lastSet && !lastSet.done && !lastSet.tag ? `<button class="link-btn muted" data-act="del-set" data-e="${ei}">Retirer la dernière</button>` : ''}</div>
  </section>`;
}
function groupBlock(g, a, ph, nx) {
  const exs = g.map((i) => a.exercises[i]);
  const first = exs[0], lastE = exs[exs.length - 1];
  const codes = exs.map((e) => e.code).filter(Boolean);
  const label = first.link === 'chain'
    ? `Enchaîne ${codes.join(' + ')} sans repos, puis ${fmtRest(lastE.rest)}`
    : `Alterne ${codes.join(' et ')}, ${fmtRest(first.rest)} entre chaque`;
  return `<section class="card group"><div class="group-head">${I.link}<span>${esc(label)}</span></div>${g.map((i) => exerciseBlock(i, a, ph, nx, true)).join('')}</section>`;
}
function viewWorkout() {
  const a = db.active;
  const ph = PHASES[a.phase] || phaseOf(a.week);
  const done = countDone(a), total = countTotal(a);
  const nx = nextSet(a);
  const allDone = total > 0 && done === total;
  const fr = a.exercises.map((e) => (e.sets.length ? Math.round((100 * e.sets.filter((s) => s.done).length) / e.sets.length) : 0));
  const segs = fr.map((f, i) => `<i><b style="width:${prevSeg[i] != null ? prevSeg[i] : f}%" data-f="${f}"></b></i>`).join('');
  prevSeg = fr;
  const first = a.exercises[0];
  const fprog = first ? progressionFor(first, ph, a.startedAt) : null;
  const ramp = first ? warmupRamp(first, fprog) : [];
  const sess = findSession(a.sessionId);
  const mob = sess && sess.region === 'bas' ? 'squats au poids du corps ×10, fentes ×10, pont fessier ×15' : 'écartés à l’élastique ×15 et rotations externes ×15';
  /* échauffement replié : la montée tient sur la ligne de résumé, les séries à saisir remontent */
  const rampTxt = ramp.map(([w, r]) => `${fmtN(w)}${NB}×${NB}${r}`).join(' · ');
  const warm = first ? `<details class="card warm"><summary><span class="ic">${I.flame}</span><span class="grow">Échauffement${rampTxt ? `<span class="warm-ramp">${rampTxt}</span>` : ''}</span></summary><p>5 min de vélo ou rameur, puis mobilité${NB}: ${mob}.</p>${ramp.length ? `<p>Montée sur ${esc(first.name)}${NB}:</p><div class="ramp">${ramp.map(([w, r]) => `<span>${fmtN(w)}${NB}${unit()}${NB}×${NB}${r}</span>`).join('')}</div>` : `<p>Puis séries de montée sur le 1er exercice${NB}: 50${NB}% × 8, 70${NB}% × 4, 85${NB}% × 2.</p>`}</details>` : '';
  const blocks = groupsOf(a.exercises).map((g) => (g.length > 1 ? groupBlock(g, a, ph, nx) : exerciseBlock(g[0], a, ph, nx, false))).join('');
  const note = a.week && ph.key !== 'b1' ? `<div style="margin-bottom:12px">${phaseNote(ph)}</div>` : '';
  /* « Terminer » est dans l’en-tête tant que la séance n’est pas finie ; en bas seulement quand tout est validé */
  return `<div class="wk" style="${pvars(a.plate)}">
    <header class="w-head float">
      <div class="w-row"><a class="icon-btn" href="#/" aria-label="Accueil (la séance continue)">${I.back}</a>${disc(a.plate, a.code || '', '', 'sdisc')}<div class="grow" style="min-width:0"><h1 class="w-title">${esc(a.name)}</h1><p class="w-sub"><b id="elapsed">${fmtElapsed((Date.now() - a.startedAt) / 1000)}</b> · ${done}/${total}<span class="sr"> séries validées</span></p></div>${allDone ? '' : '<button class="w-finish" data-act="finish">Terminer</button>'}</div>
      <div class="segbar" aria-hidden="true">${segs}</div>
    </header>
    ${note}${warm}${coachWorkoutCard(a)}${blocks}
    <button class="btn quiet add" data-act="w-add-ex">${I.plus} Ajouter un exercice</button>
  </div>
  ${allDone ? `<div class="wbar float"><button class="btn primary" data-act="finish">Terminer la séance</button></div>` : ''}`;
}

/* ============ Historique ============ */
function viewHistory() {
  const add = `<a class="btn quiet" href="#/historique/ajouter">${I.plus} Ajouter une séance passée</a>`;

/* Série de la dernière fois qui correspond à la série si (back-off avec back-off) */
function refSet(ex, si, ref) {
  const bo = ex.sets[si].tag === 'backoff';
  const pool = ref ? ref.sets.filter((x) => (x.tag === 'backoff') === bo) : [];
  const nth = bo ? 0 : ex.sets.slice(0, si).filter((x) => x.tag !== 'backoff').length;
  return pool[nth] || pool[pool.length - 1] || {};
}
/* Charge en gris : celle de la série précédente, sinon celle de la dernière fois (pas de report sur la back-off) */
function weightHint(ex, si, ref) {
  if (ex.sets[si].tag !== 'backoff') for (let j = si - 1; j >= 0; j--) { const x = ex.sets[j]; if (!x.tag && x.w != null) return x.w; }
  const p = refSet(ex, si, ref);
  return p.w != null ? p.w : null;
}
function editSetRow(ex, ei, s, si, ref, cls) {

  const f = (field, mode, label, val, plh) => `<input class="num" type="text" inputmode="${mode}" autocomplete="off" enterkeyhint="done" data-le="${ei}" data-ls="${si}" data-lf="${field}" value="${fmtIn(val)}" placeholder="${fmtIn(plh)}" aria-label="${label}, ${esc(ex.name)}, série ${si + 1}">`;
  let inputs;
  if (ex.type === 'charge') inputs = f('w', 'decimal', `Charge en ${unit()}`, s.w, p.w) + f('r', 'numeric', 'Répétitions', s.r, p.r);
  else if (ex.type === 'reps') inputs = f('r', 'numeric', 'Répétitions', s.r, p.r);

  else inputs = f('d', 'decimal', 'Distance en km', s.d, p.d) + f('t', 'decimal', 'Durée en minutes', s.t, p.t);
  const tag = bo ? `<p class="set-tag">Back-off${NB}: −25${NB}% pour 12-15 reps</p>` : s.tag === 'drop' ? `<p class="set-tag">Dernière série en drop set</p>` : '';
  const row = `<div class="set ${cls}"><span class="set-n" aria-hidden="true">${bo ? 'B' : si + 1}</span>${inputs}<button class="ok rm" data-act="le-del-set" data-e="${ei}" data-s="${si}" aria-label="Retirer la série ${si + 1} de ${esc(ex.name)}" ${ex.sets.length < 2 ? 'disabled' : ''}>${I.x}</button></div>`;

  return tag + row + drop;
}

/* ============ Progrès ============ */
const DEC_COL = { ok: '#46D98A', perfect: '#46D98A', slow: '#FFC75A', slow2: '#FFC75A', fast: '#FF7A75', fast2: '#FF7A75', info: '#9AB8D6' };
/* Graduations rondes : pas de 0,5 / 1 / 2 / 2,5 / 5… pour 3 ou 4 lignes */
function niceTicks(a, b) {
  if (b - a < 1e-9) { a -= 1; b += 1; }
  const step = [0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100].find((x) => (b - a) / x <= 3) || 100;
  const lo = Math.floor(a / step) * step, hi = Math.ceil(b / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(Math.round(v * 100) / 100);
  return { lo, hi, ticks };
}
/* largeur intérieure d’une carte de #app (marges de #app 2 × 20, de la carte 2 × 18, bordures) */
const chartW = () => Math.max(240, Math.round(Math.min(app.clientWidth || 375, 560) - 78));
const gridLines = (ticks, Y, L, x2) => ticks.map((v) => `<line class="ch-grid" x1="${L}" x2="${x2}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="ch-txt" x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${fmtN(v)}</text>`).join('');
function weightChart(rows, cur) {
  const W = chartW(), H = 200, L = 40, R = 52, T = 14, B = 28, n = rows.length;
  const pts = rows.filter((r) => r.avg != null);
  const vals = rows.map((r) => r.ref).concat(pts.map((r) => r.avg));
  const { lo, hi, ticks } = niceTicks(Math.min(...vals), Math.max(...vals));
  const X = (w) => L + ((w - 1) * (W - L - R)) / Math.max(1, n - 1);
  const Y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ref = rows.map((r, i) => `${i ? 'L' : 'M'}${X(r.w).toFixed(1)} ${Y(r.ref).toFixed(1)}`).join(' ');
  let d = '', prevOk = false;
  rows.forEach((r) => { if (r.avg == null) { prevOk = false; return; } d += `${prevOk ? 'L' : 'M'}${X(r.w).toFixed(1)} ${Y(r.avg).toFixed(1)} `; prevOk = true; });
  const dots = pts.map((r, i) => `<circle class="ch-dot" cx="${X(r.w).toFixed(1)}" cy="${Y(r.avg).toFixed(1)}" r="4.5" style="fill:#5C8DFF;animation-delay:${250 + i * 50}ms"/>`).join('');
  const now = cur >= 1 && cur <= n ? `<line x1="${X(cur).toFixed(1)}" x2="${X(cur).toFixed(1)}" y1="${T}" y2="${H - B}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>` : '';
  const step = n > 8 ? 2 : 1;
  const xl = rows.filter((r) => (r.w - 1) % step === 0 || r.w === cur).map((r) => `<text class="ch-txt" x="${X(r.w).toFixed(1)}" y="${H - 8}" text-anchor="middle" style="${r.w === cur ? 'fill:var(--ink);font-weight:700' : ''}">S${r.w}</text>`).join('');
  /* étiquettes directes : ta moyenne au dernier point, « repère » au bout des pointillés */
  const last = pts[pts.length - 1], lastRef = rows[n - 1];
  const lab = (last ? `<text class="ch-lab" x="${(X(last.w) + 8).toFixed(1)}" y="${(Y(last.avg) - 8).toFixed(1)}">${fmt1(last.avg)}</text>` : '')
    + `<text class="ch-txt" x="${(X(lastRef.w) + 6).toFixed(1)}" y="${(Y(lastRef.ref) + 4).toFixed(1)}">repère</text>`;
  const desc = pts.map((r) => `S${r.w}${NB}: ${fmt1(r.avg)}${NB}kg`).join(', ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Poids moyen par semaine${desc ? `${NB}: ${desc}` : ''}">${gridLines(ticks, Y, L, W - R)}${now}<path class="ch-ref" d="${ref}"/>${d ? `<path class="ch-line" d="${d.trim()}" pathLength="1" stroke="#5C8DFF"/>` : ''}${dots}${lab}${xl}</svg>`;
}
function regularitySVG() {
  const W = chartW(), H = 172, B = 24, T = 28, n = 12, goal = db.settings.weeklyGoal;
  const cur = programWeek();
  const first = cur > 12 ? cur - 11 : 1;
  const weeks = [];
  for (let k = first; k < first + n; k++) { const { s, e } = weekRange(k); weeks.push({ w: k, logs: db.logs.filter((l) => l.startedAt >= s && l.startedAt < e) }); }
  const maxN = Math.max(goal, ...weeks.map((x) => x.logs.length), 1);
  const gap = 2, seg = Math.min(16, (H - B - T - (maxN - 1) * gap) / maxN);
  const colW = W / n, bw = Math.min(20, colW - 9);
  let bars = '';
  weeks.forEach((wk, i) => {
    const x = i * colW + (colW - bw) / 2, k = wk.logs.length;
    if (!k) { bars += `<rect class="rg-empty" x="${x.toFixed(1)}" y="${H - B - 3}" width="${bw.toFixed(1)}" height="3" rx="1.5"/>`; return; }
    wk.logs.forEach((l, j) => { const p = plateOf(l.plate); const y = H - B - (j + 1) * seg - j * gap; bars += `<rect class="rg-seg" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${seg.toFixed(1)}" rx="3" style="fill:${p.hi};animation-delay:${i * 35 + j * 60}ms"/>`; });
    const top = H - B - k * seg - (k - 1) * gap;
    bars += `<text class="ch-txt" x="${(x + bw / 2).toFixed(1)}" y="${(top - 6).toFixed(1)}" text-anchor="middle" style="${wk.w === cur ? 'fill:var(--ink);font-weight:700' : ''}">${k}${k >= goal ? '✓' : ''}</text>`;
  });
  const gy = H - B - goal * seg - (goal - 1) * gap - gap / 2;
  const xs = colW < 27 ? 2 : 1;
  const xl = weeks.filter((wk, i) => i % xs === 0 || wk.w === cur).map((wk) => { const i = weeks.indexOf(wk); return `<text class="ch-txt" x="${(i * colW + colW / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" style="${wk.w === cur ? 'fill:var(--ink);font-weight:700' : ''}">S${wk.w}</text>`; }).join('');
  const desc = weeks.filter((wk) => wk.w <= Math.max(cur, 1)).map((wk) => `S${wk.w}${NB}: ${wk.logs.length}`).join(', ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Séances par semaine, objectif ${goal}${desc ? `${NB}: ${desc}` : ''}"><line class="ch-goal" x1="0" x2="${W}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}"/>${bars}${xl}</svg>`;
}
function lineChart(pts, type) {

}
function exerciseIndex() {
  const map = new Map();
  for (const l of db.logs) for (const e of l.exercises) {
    const key = e.type + '|' + norm(e.name);
    let r = map.get(key);
    if (!r) { r = { key, name: e.name, type: e.type, last: 0 }; map.set(key, r); }
    if (l.startedAt >= r.last) { r.last = l.startedAt; r.name = e.name; }
  }
  return [...map.values()].sort((a, b) => b.last - a.last);
}
function seriesFor(x) {
  const pts = [];
  for (const l of db.logs) {
    let best = null, src = null;
    for (const e of l.exercises) { if (e.type + '|' + norm(e.name) !== x.key) continue; const b = bestOf(e); if (b && better(b, best)) { best = b; src = e; } }
    if (best) pts.push({ ts: l.startedAt, val: best.val, sub: best.sub, text: best.text, plate: l.plate, ex: src, logId: l.id });
  }
  return pts;
}

    const prev = perfHistory(e.exId, e.name, l.startedAt, 1, l.id)[0];
    const hb = historicBest(e.exId, e.name, e.type, l.startedAt), b = bestOf(e);
    lines.push(`- ${e.code ? e.code + ' ' : ''}${e.name} : ${perfText(e)}${prev ? ` (fois précédente, ${coachDay(prev.log.startedAt)} : ${perfText(prev.ex)})` : ' (première fois)'}${hb && b && better(b, hb) ? ' → nouveau record' : ''}`);
  }
  const s = findSession(l.sessionId);
  const missing = s ? s.exercises.filter((pe) => !matchEx(l, pe.id, pe.name)) : [];
  if (missing.length) lines.push(`Exercices du programme non faits : ${missing.map((x) => x.name).join(', ')}.`);
  if (l.notes) lines.push(`Notes de l’athlète : « ${l.notes} »`);
  lines.push('Fais le bilan de cette séance.');

/* ============ Coach : appel de l’API (flux SSE) ============ */
function coachErrText(e) {
  switch (e.kind) {
    case 'offline': return 'Pas de connexion internet.';
    case 'net': return 'Connexion à Claude impossible. Vérifie ta connexion internet.';
    case 'timeout': return 'Le coach met trop de temps à répondre.';
    case 'auth': return `Clé API refusée ou expirée. Vérifie-la dans Réglages, Coach${NB}IA.`;
    case 'scope': return `Cette clé n’est rattachée à aucun espace de travail. Chez Anthropic, crée une nouvelle clé en choisissant un espace de travail («${NB}Workspace${NB}»), puis colle-la ici.`;
    case 'cors': return 'Ce compte Anthropic n’autorise pas les appels depuis une app web. Le coach ne peut pas fonctionner avec cette clé.';
    case 'perm': return 'Cette clé n’a pas le droit d’utiliser ce modèle.';
    case 'credit': return 'Crédit épuisé ou limite de dépense atteinte sur ton compte Anthropic.';
    case 'rate': return e.wait ? `Trop de demandes d’un coup. Réessaie dans ${plural(e.wait, 'seconde', 'secondes')}.` : 'Trop de demandes d’un coup. Réessaie dans une minute.';
    case 'overload': return 'Claude est surchargé pour le moment. Réessaie dans un instant.';
    case 'big': return 'Conversation trop longue. Démarre une nouvelle conversation.';
    case 'refusal': return 'Le coach n’a pas pu répondre à cette demande. Reformule ta question.';
    case 'empty': return 'Le coach n’a rien répondu. Réessaie.';

  }
}
function coachErrOf(status, j, res) {
  const type = (j && j.type) || '', msg = (j && j.msg) || '', code = (j && j.code) || '';
  /* deux refus liés au compte, à expliquer autrement qu’une clé fausse : clé sans espace de travail (400), appels navigateur interdits (401) */
  if (/not scoped to a workspace|anthropic-workspace-id/i.test(msg)) return new CoachError('scope', status, msg);
  if (/CORS requests are not allowed/i.test(msg)) return new CoachError('cors', status, msg);
  if (status === 401 || type === 'authentication_error') return new CoachError('auth', status, msg);
  if (status === 402 || type === 'billing_error' || code === 'enforced_spend_limit_reached' || /credit balance|usage limits|spend limit/i.test(msg)) return new CoachError('credit', status, msg);
  if (status === 403 || type === 'permission_error') return new CoachError('perm', status, msg);

    try { ra = parseInt(res && res.headers ? res.headers.get('retry-after') : '', 10); } catch (e) { ra = NaN; }

}

  if (navigator.onLine === false) return { ok: false, error: 'Pas de connexion internet.' };
  const run = { id: '', k: 'test', ctrl: new AbortController(), text: '', why: '', usage: null, raf: 0 };
  const timer = setTimeout(() => { run.why = 'timeout'; run.ctrl.abort(); }, 45000);
  const body = {
    model: COACH_MODEL, max_tokens: 2048, stream: true, output_config: { effort: 'medium' }, cache_control: { type: 'ephemeral' },
    system: [{ type: 'text', text: 'Test de connexion de l’app Carnet.' }, { type: 'text', text: 'Aucune donnée dans ce test : réponds par un seul mot.', cache_control: { type: 'ephemeral', ttl: '1h' } }],

/* ============ Coach : conversations ============ */
function coachNewFil(kind, title, extra) {
  const now = Date.now();
  const f = Object.assign({ id: uid(), kind, title, at: now, up: now, aid: '', logId: '', t0: 0, msgs: [], plan: null, tips: {}, tip: null, fails: 0, mute: '', muteNet: false, hold: '', berr: '', bilan: 0, tries: 0, retryAt: 0, sysAt: 0 }, extra || {});

/* Fil de la séance en cours (créé au besoin) ; les fils des séances abandonnées partent */
function coachSeanceGet(a) {

  let fil = coachSeanceFil(a);

  const now = Date.now();
  for (const m of fil.msgs) if (m.w) m.w = 0;
  const run = coachRuns.get(fil.id);
  if (run) {
    const user = (x) => x === 'q' || x === 'chat';
    /* une question ou le bilan interrompt une demande automatique ; une série validée remplace le conseil de la précédente */
    if (user(k) || k === 'bilan' ? !user(run.k) : run.k === 'set' || run.k === 'ex') { run.why = 'new'; run.ctrl.abort(); }
  }

    if (fil.hold || Date.now() < (fil.retryAt || 0) || navigator.onLine === false) return;
    const l = db.logs.find((x) => x.id === fil.logId);
    if (!l || Date.now() - l.endedAt > 7 * DAY && Date.now() - fil.up > 7 * DAY) { fil.bilan = 0; coachSaveFils(); return; }

  }

  if (out && !text) { err = new CoachError('empty'); out = null; }

/* Le coach est facultatif et s’insère dans des écrans vitaux (accueil, séance, réglages, démarrage) :
   les fonctions appelées depuis ces écrans attrapent leurs propres erreurs et rendent alors un contenu vide. */
/* Texte du modèle : toujours échappé, puis une mise en forme minimale (gras, listes, paragraphes) */
function coachFormat(txt) {
  const inline = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '$1');
  const out = [];
  let list = null, para = [];
  const flushP = () => { if (para.length) { out.push(`<p>${para.join('<br>')}</p>`); para = []; } };
  const flushL = () => { if (list) { out.push(`<${list.tag}${list.start > 1 ? ` start="${list.start}"` : ''}>${list.items.map((x) => `<li>${x}</li>`).join('')}</${list.tag}>`); list = null; } };
  for (const raw of String(txt || '').replace(/\r/g, '').split('\n')) {
    const line = raw.trim();
    if (!line) { flushP(); flushL(); continue; }
    let m = line.match(/^#{1,4}\s+(.*)$/);
    if (m) { flushP(); flushL(); out.push(`<p class="cm-h">${inline(m[1].replace(/\*\*/g, ''))}</p>`); continue; }
    m = line.match(/^[-*•–]\s+(.*)$/);
    if (m) { flushP(); if (!list || list.tag !== 'ul') { flushL(); list = { tag: 'ul', start: 1, items: [] }; } list.items.push(inline(m[1])); continue; }
    m = line.match(/^(\d{1,2})[.)]\s+(.*)$/);
    if (m) { flushP(); if (!list || list.tag !== 'ol') { flushL(); list = { tag: 'ol', start: +m[1], items: [] }; } list.items.push(inline(m[2])); continue; }
    flushL();
    para.push(inline(line));
  }
  flushP(); flushL();
  return out.join('');
}

/* Chiffres clés calculés par l’app, sans IA : visibles aussi sans clé et hors ligne */
function coachFacts() {
  const now = Date.now(), cur = programWeek(now), info = weekInfo(now), goal = db.settings.weeklyGoal;
  const F = { cur, week: info.logs.length, goal, past: null, weight: null, sleep: null, records: [], up: [], stalled: [] };
  if (cur > 1) {
    const s0 = weekRange(1).s, e0 = weekRange(cur).s;
    const done = db.logs.filter((l) => l.startedAt >= s0 && l.startedAt < e0).length;
    F.past = { weeks: cur - 1, done, pct: Math.round((100 * done) / ((cur - 1) * goal)) };
  }
  F.weight = [...weeklyReview()].reverse().find((r) => r.w <= cur && r.avg != null) || null;
  const sh = [], sq = [];
  for (let i = 0; i < 7; i++) { const d = db.daily[isoDay(addDays(now, -i))]; if (d && d.sh != null) sh.push(d.sh); if (d && d.sq) sq.push(d.sq); }
  const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;
  if (sh.length) F.sleep = { h: avg(sh), q: sq.length ? avg(sq) : null };
  const best = new Map(), recs = new Map();
  for (const l of db.logs) for (const x of l.exercises) {
    const k = x.type + '|' + norm(x.name), b = bestOf(x);
    if (!b) continue;
    const prev = best.get(k);
    if (prev && better(b, prev) && now - l.startedAt < 14 * DAY) recs.set(k, { name: x.name, text: b.text, ts: l.startedAt });
    if (!prev || better(b, prev)) best.set(k, b);
  }
  F.records = [...recs.values()].sort((a, b) => b.ts - a.ts);
  for (const s of db.program.sessions) for (const e of s.exercises) {
    const pr = progressionFor(activeFrom(e, info.ph), info.ph, now);
    if (pr.kind === 'warn') F.stalled.push(e.name); else if (pr.kind === 'up') F.up.push(e.name);
  }
  return F;
}

/* ============ Coach : actions et saisies ============ */
async function coachConnect(b) {
  const inp = $('#f-coachkey'), errEl = $('[data-coach-error]');
  const key = inp ? inp.value.trim() : '';
  const fail = (t) => { b.disabled = false; b.textContent = 'Activer le coach'; if (errEl) { errEl.textContent = t; errEl.hidden = false; } };
  if (!/^sk-ant-[A-Za-z0-9_-]{20,}$/.test(key)) { fail(`Colle la clé en entier${NB}: elle commence par sk-ant-.`); return; }
  b.disabled = true; b.textContent = 'Vérification…';
  const r = await coachTest(key);
  if (!r.ok) { fail(r.error); return; }
  coachCfg.key = key; coachCfg.err = null;
  coachSaveCfg();
  if (view.name === 'settings') render(true);

}

/* Au lancement : fils de séances abandonnées, réponses interrompues par la fermeture de l’app, bilans en attente */
function coachInit() {
  try {
    const live = db.active ? db.active.id : '';
    const del = new Set(db.deletedLogs);
    const n = coachStore.fils.length;
    let changed = false;
    coachStore.fils = coachStore.fils.filter((f) => !(f.kind === 'seance' && f.aid && !f.logId && f.aid !== live) && !(f.logId && del.has(f.logId)));
    for (const k of Object.keys(coachStore.bilans)) if (del.has(k)) { delete coachStore.bilans[k]; changed = true; }
    for (const f of coachStore.fils) f.msgs.forEach((m, i) => {
      if (!m.w) return;
      m.w = 0; changed = true;
      if ((m.k === 'chat' || m.k === 'q') && i === f.msgs.length - 1) m.err = 'Réponse interrompue.';
    });
    if (changed || coachStore.fils.length !== n) coachSaveFils();
    /* clavier ouvert : la barre de saisie remonte au-dessus (iOS ne redimensionne pas la page) */

    const w = programWeek(), ph = phaseOf(w);
    db.active = { id: uid(), sessionId: s.id, code: s.code, name: s.name, plate: s.plate, startedAt: Date.now(), week: w || null, phase: ph.key, exercises: s.exercises.map((e) => activeFrom(e, ph)), timer: null, cursor: null };

  };

    confirmSheet({ title: 'Une séance est déjà en cours', text: `«${NB}${db.active.name}${NB}» n’est pas terminée. Si tu démarres «${NB}${s.name}${NB}», elle sera abandonnée sans être enregistrée.`, ok: 'Abandonner et démarrer', onOk: () => { coachOnDiscard(db.active); db.active = null; begin(); } });

const activePhase = (a) => PHASES[a.phase] || phaseOf(a.week);
function checkSet(ei, si) {
  const a = db.active, ex = a && a.exercises[ei], s = ex && ex.sets[si];
  if (!s) return;
  if (s.done) { s.done = false; a.cursor = { ei, si }; expanded.add(ei); save(); render(true); return; }
  const prog = progressionFor(ex, activePhase(a), a.startedAt);
  const plh = placeholders(ex, si, prog);
  const fields = { charge: ['w', 'r'], reps: ['r'], duree: ['t'], cardio: ['d', 't'] }[ex.type] || ['r'];
  for (const f of fields) if (s[f] == null && plh[f] != null) s[f] = plh[f];
  if (!isReqOk(ex.type, s)) {
    const need = ex.type === 'duree' ? 't' : ex.type === 'cardio' ? 'd' : 'r';
    const input = app.querySelector(`.num[data-e="${ei}"][data-s="${si}"][data-f="${need}"]`);
    if (input) { input.classList.add('need'); input.focus(); setTimeout(() => input.classList.remove('need'), 1600); }
    toast(ex.type === 'duree' ? 'Indique la durée de la série' : ex.type === 'cardio' ? 'Indique la distance ou la durée' : 'Indique le nombre de répétitions');
    return;
  }
  s.done = true; s.at = Date.now();
  justChecked = ei + ':' + si; scrollToNext = true;
  const nxt = nextPending(ei, si);
  a.cursor = nxt;
  if (ex.sets.every((x) => x.done)) { justDoneEi = ei; expanded.delete(ei); if (nxt && nxt.ei !== ei) scrollToEi = nxt.ei; }
  if (ex.rest > 0 && nxt) startTimer('rest', ex.rest, nxt);
  else { if (!nxt) a.timer = null; save(); if (!nxt) toast('Toutes les séries sont validées'); }
  coachOnSet(ei, si, nxt);
  render(true);
}

   Ajouter dans une semaine déjà mesurée la complète : les champs laissés vides gardent leur valeur.

function openMeasures(k) {
  const today = isoDay();
  const editKey = k && hasMeasure(db.measures[k]) ? k : null;
  const ex = editKey ? db.measures[editKey] : {};
  const ex0 = canon(editKey ? ex : null);
  const weekDate = (key) => { const n = +key.slice(1); return isoDay(Math.min(n ? weekRange(n).s : addDays(weekStart(programStart()), -1), Date.now())); };
  let date = editKey ? (isIsoDay(ex.date) && ex.date <= today ? ex.date : weekDate(editKey)) : today;
  let dateTouched = false;
  const target = () => (editKey && !dateTouched ? editKey : 'S' + programWeek(parseIso(date)));
  const atFor = (key) => Math.max(Date.now(), ((db.measures[key] && db.measures[key].at) || 0) + 1);
  const info = () => {
    const key = target(), n = +key.slice(1), cw = checkpointWeight(key), old = db.measures[key];
    const rec = CHECKPOINTS.some(([c]) => c === key);
    const merge = key !== editKey && hasMeasure(old) ? `<span class="warn-t"> Cette semaine a déjà une mesure${isIsoDay(old.date) ? ' (' + fmtDay(parseIso(old.date)) + ')' : ''}${NB}: les champs laissés vides gardent leur valeur.</span>` : '';
    return `${n ? `Semaine ${key}` : 'Avant le début du programme (S0)'}${rec ? ', bilan conseillé' : ''}. ${n ? 'Poids moyen' : 'Poids de départ'}${NB}: ${cw != null ? `${fmt1(cw)}${NB}kg` : 'pas encore de pesée cette semaine'}.${merge}`;
  };
  openSheet(`<div class="sheet-head"><h2 class="sheet-title">${editKey ? `Mensurations ${editKey}` : 'Ajouter des mensurations'}</h2><button class="link-btn muted" data-sact="cancel">Annuler</button></div><p class="muted small">Le matin, à jeun, muscles froids, toujours au même endroit.</p>
    <label class="field"><span>Date de la mesure</span><input class="input" type="date" id="f-mdate" value="${date}" max="${today}"></label>
    <p class="hint" data-mweek>${info()}</p>
    <div class="field-row">${MEASURES.map(([f, l]) => `<label class="field"><span>${esc(l)}</span><span class="ci-in"><input class="input" type="text" inputmode="decimal" autocomplete="off" data-m="${f}" value="${fmtIn(ex[f])}" placeholder="–" style="padding-right:40px"><em>cm</em></span></label>`).join('')}</div>
    <details class="rule" style="margin-top:14px"><summary>Comment mesurer</summary>${MEASURES.map(([, l, h]) => `<p><b>${esc(l)}</b>${NB}: ${esc(h)}</p>`).join('')}</details>
    <div class="sheet-foot${editKey ? ' two' : ''}">${editKey ? '<button class="btn danger-line" data-sact="delete">Supprimer</button>' : ''}<button class="btn primary" data-sact="save" data-msave>Enregistrer ${target()}</button></div>`, {
    change: (e) => {
      if (e.target.id !== 'f-mdate' || !isIsoDay(e.target.value)) return;
      date = e.target.value; dateTouched = true;
      sheet.querySelector('[data-mweek]').innerHTML = info();
      sheet.querySelector('[data-msave]').textContent = `Enregistrer ${target()}`;
    },
    save: () => {
      const di = sheet.querySelector('#f-mdate');
      if (di && isIsoDay(di.value) && di.value !== date) { date = di.value; dateTouched = true; }
      if (!isIsoDay(date) || date > isoDay()) { flagEl(di); toast('Choisis une date passée ou aujourd’hui'); return; }
      const key = target();
      const old = key !== editKey && hasMeasure(db.measures[key]) ? db.measures[key] : null;
      const o = { date, at: atFor(key) };
      $$('[data-m]', sheet).forEach((inp) => { const v = parseNum(inp.value); o[inp.dataset.m] = v != null ? v : old ? old[inp.dataset.m] : null; });
      if (!$$('[data-m]', sheet).some((inp) => parseNum(inp.value) != null)) { flagEl(sheet.querySelector('[data-m]')); toast('Saisis au moins une mesure'); return; }
      const commit = () => {
        db.measures[key] = normMeasures({ [key]: o })[key];
        if (editKey && editKey !== key) db.measures[editKey] = normMeasures({ [editKey]: { date: ex.date, at: atFor(editKey) } })[editKey];
        save(true); touchData(800);
        closeSheet(); render(true);
        toast(`Mensurations ${key} enregistrées`);
      };
      /* la synchro a changé cette mesure pendant la saisie : on demande avant d’écraser */
      if (editKey && canon(db.measures[editKey] || null) !== ex0) confirmSheet({ title: 'Modifiées sur un autre appareil', text: `Ces mensurations ont changé ailleurs pendant ta saisie. Garder ta version à la place${NB}?`, ok: 'Garder ma version', danger: false, onOk: commit });
      else commit();
    },
    delete: () => confirmSheet({ title: `Supprimer les mensurations ${editKey}${NB}?`, text: 'Elles seront aussi retirées de ta sauvegarde GitHub à la prochaine synchro.', ok: 'Supprimer', onOk: () => {
      db.measures[editKey] = normMeasures({ [editKey]: { date: ex.date, at: atFor(editKey) } })[editKey];
      save(true); touchData(800); render(true);
      toast(`Mensurations ${editKey} supprimées`);
    } }),
    cancel: closeSheet,
  });
}

/* ============ Historique : modifier ou ajouter une séance passée ============ */
const draftTs = (d) => (isIsoDay(d.date) && /^\d{1,2}:\d{2}$/.test(d.time || '') ? localTs(d.date, d.time) : NaN);
const draftChoices = () => db.program.sessions.filter((s) => s.kind === 'cross' || s.exercises.length);
const pickable = (s) => (s && (s.kind === 'cross' || s.exercises.length) ? s : null);
const draftEx = (a) => ({ exId: a.exId, code: a.code, name: a.name, type: a.type, sets: a.sets.map((s) => Object.assign({ w: null, r: null, t: null, d: null }, s.tag ? { tag: s.tag } : {})) });
const draftPhase = (d) => { const ts = draftTs(d); return phaseOf(isFinite(ts) ? programWeek(ts) : 0); };
function plannedSession(day) {
  const ts = localTs(day, '12:00');
  const sid = (db.program.schedule[crossVariant(programWeek(ts))] || [])[dowOf(ts)];
  return sid ? findSession(sid) : null;
}
function setDraftSession(d, s) {
  Object.assign(d, { sessionId: s.id, kind: s.kind, name: s.name, code: s.code, plate: s.plate });
  const ph = draftPhase(d);
  d.exercises = s.kind === 'cross' ? [] : s.exercises.map((e) => draftEx(activeFrom(e, ph)));
  if (!d.minsTouched) d.mins = s.minutes || 60;
}
/* Brouillon : src = copie de la séance telle qu’à l’ouverture (null pour un ajout) ; typed = valeurs saisies,
   shaped = exercices ou séries ajoutés/retirés, dirty = n’importe quel changement ; from = page d’où l’on vient. */
const setHasVal = (s) => ['w', 'r', 't', 'd', 'dw', 'dr'].some((f) => s[f] != null);
function initLogDraft(v, key) {
  const from = navs ? fromHash : '';
  if (v.id) {
    const l = db.logs.find((x) => x.id === v.id);
    if (!l) return null;
    return {
      key, from, id: l.id, src: JSON.parse(JSON.stringify(l)), sessionId: l.sessionId, kind: l.kind, name: l.name, code: l.code, plate: l.plate,
      date: isoDay(l.startedAt), time: hhmm(l.startedAt), mins: Math.max(5, Math.round(l.duration / 60)), minsTouched: false, notes: l.notes,
      exercises: JSON.parse(JSON.stringify(l.exercises)), typed: false, shaped: false, dirty: false,
    };
  }
  const today = isoDay();
  const date = v.date && v.date <= today ? v.date : today;
  const s = pickable(v.sid && findSession(v.sid)) || pickable(plannedSession(date)) || draftChoices().find((x) => x.kind === 'muscu') || draftChoices()[0];
  if (!s) return null;
  const d = { key, from, id: null, src: null, date, time: '18:00', mins: s.minutes || 60, minsTouched: false, notes: '', typed: false, shaped: false, dirty: false, sessionAuto: !v.sid };
  if (date === today) {
    const t = new Date(Math.max(localTs(today, '00:00'), Date.now() - d.mins * 60000));
    t.setMinutes(t.getMinutes() - (t.getMinutes() % 5));
    d.time = hhmm(t.getTime());
  }
  setDraftSession(d, s);
  return d;
}
function flagEl(el) { if (!el) return; el.classList.add('need'); el.focus(); setTimeout(() => el.classList.remove('need'), 1600); }
function leaveDraft(to) {
  const from = logDraft && logDraft.from;
  logDraft = null;
  if (navs && from && (!to || from === to)) history.back();
  else if (to) location.replace(to);
  else if (navs) history.back();
  else location.replace('#/historique');
}
function saveLogDraft(opts) {
  const o = opts || {}, d = logDraft;
  if (!d) return;
  if (!isIsoDay(d.date) || d.date > isoDay()) { flagEl($('#f-ldate')); toast('Choisis un jour passé ou aujourd’hui'); return; }
  if (!/^\d{1,2}:\d{2}$/.test(d.time || '')) { flagEl($('#f-ltime')); toast('Indique l’heure de début'); return; }
  const src = o.asNew ? null : d.src;
  const orig = src ? db.logs.find((l) => l.id === src.id) : null;
  if (src && !orig) {
    confirmSheet({ title: 'Séance supprimée entre-temps', text: `Elle a été supprimée sur un autre appareil pendant ta saisie. L’enregistrer comme nouvelle séance${NB}?`, ok: 'Enregistrer comme nouvelle', danger: false, onOk: () => saveLogDraft({ asNew: true }) });
    return;
  }
  const same = !!src && d.date === isoDay(src.startedAt) && d.time === hhmm(src.startedAt);
  const startedAt = same ? src.startedAt : localTs(d.date, d.time);
  if (startedAt > Date.now()) { flagEl($('#f-ltime')); toast('Cette heure n’est pas encore passée'); return; }
  const exercises = [];
  if (d.kind === 'muscu') {
    for (let ei = 0; ei < d.exercises.length; ei++) {
      const e = d.exercises[ei], sets = [];
      const prev = perfHistory(e.exId, e.name, startedAt, 1, d.id)[0];
      for (let si = 0; si < e.sets.length; si++) {
        const s = e.sets[si];
        if (!setHasVal(s)) continue;
        if (!isReqOk(e.type, s)) {
          const need = e.type === 'duree' ? 't' : e.type === 'cardio' ? 'd' : 'r';
          flagEl(app.querySelector(`.num[data-le="${ei}"][data-ls="${si}"][data-lf="${need}"]`));
          toast(e.type === 'duree' ? 'Indique la durée de la série' : e.type === 'cardio' ? 'Indique la distance ou la durée' : 'Indique le nombre de répétitions');
          return;
        }
        /* charge laissée vide sur une série saisie ici : celle affichée en gris, comme pendant la séance */
        sets.push(e.type === 'charge' && s.w == null && s._t ? Object.assign({}, s, { w: weightHint(e, si, prev ? prev.ex : null) }) : s);
      }
      if (sets.length) exercises.push({ exId: e.exId, code: e.code, name: e.name, type: e.type, sets });
    }
    if (!exercises.length) { flagEl(app.querySelector('.num[data-lf]')); toast('Saisis au moins une série'); return; }
  }
  const dayChanged = !src || isoDay(src.startedAt) !== isoDay(startedAt);
  const w = programWeek(startedAt);
  const duration = src && !d.minsTouched ? src.duration : d.mins * 60;
  const base = {
    id: src ? src.id : uid(), sessionId: d.sessionId, kind: d.kind, name: d.name, code: d.code, plate: d.plate,
    startedAt, endedAt: same && duration === src.duration ? src.endedAt : startedAt + duration * 1000, duration,
    week: dayChanged ? w || null : src.week, phase: dayChanged ? phaseOf(w).key : src.phase, notes: d.notes.trim(), exercises,
  };
  let log;
  if (src) {
    const was = canon(normLog(src));
    if (canon(normLog(Object.assign({}, base, { updatedAt: src.updatedAt }))) === was) { leaveDraft('#/historique/' + encodeURIComponent(src.id)); toast('Aucun changement'); return; }
    if (!o.force && canon(orig) !== was) {
      confirmSheet({ title: 'Modifiée sur un autre appareil', text: `Cette séance a changé ailleurs pendant ta saisie. Garder ta version à la place${NB}?`, ok: 'Garder ma version', danger: false, onOk: () => saveLogDraft({ force: true }) });
      return;
    }
    log = normLog(Object.assign(base, { updatedAt: Math.max(Date.now(), (orig.updatedAt || 0) + 1) }));
    db.logs = db.logs.map((l) => (l.id === orig.id ? log : l));
  } else {
    log = normLog(base);
    db.logs.push(log);
  }
  db.logs.sort(logOrder);
  save(true); touchData(800);
  leaveDraft('#/historique/' + encodeURIComponent(log.id));
  toast(src ? 'Séance modifiée' : 'Séance ajoutée');
}

app.addEventListener('click', (e) => {
  const rb = e.target.closest('[data-rate]');
  if (rb) { const f = rb.dataset.rate, v = +rb.dataset.v; const cur = dayEntry(isoDay()); ciUpdate(f, cur && cur[f] === v ? null : v, true); return; }
  const st = e.target.closest('[data-step]');
  if (st) {
    const k = st.closest('[data-stepper]').dataset.stepper, d = +st.dataset.step;
    if (k === 'goal') { db.settings.weeklyGoal = clamp(db.settings.weeklyGoal + d, 1, 7); touchSettings(); save(); render(true); }
    if (k === 'defrest') { db.settings.defaultRest = clamp(db.settings.defaultRest + d * 15, 0, 600); touchSettings(); save(); st.closest('[data-stepper]').querySelector('output').textContent = fmtRest(db.settings.defaultRest); }
    if (k === 'ldur' && logDraft) {
      const L = logDraft;
      L.mins = clamp(d > 0 ? Math.floor(L.mins / 5) * 5 + 5 : Math.ceil(L.mins / 5) * 5 - 5, 5, 300);
      L.minsTouched = true; L.dirty = true;
      st.closest('[data-stepper]').querySelector('output').textContent = fmtDur(L.mins * 60);
    }
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b); }
});
app.addEventListener('input', (e) => {
  const t = e.target;
  if (coachInput(t)) return;
  if (t.dataset.ci) { ciUpdate(t.dataset.ci, parseNum(t.value)); return; }
  if (t.dataset.lf && logDraft) {
    const ei = +t.dataset.le, si = +t.dataset.ls, f = t.dataset.lf;
    const ex = logDraft.exercises[ei], s = ex && ex.sets[si];
    if (!s) return;
    s[f] = parseNum(t.value); s._t = true; logDraft.typed = logDraft.dirty = true;
    /* la charge saisie devient la charge en gris des séries suivantes encore vides */
    if (f === 'w' && s.w != null && !s.tag) {
      for (let j = si + 1; j < ex.sets.length; j++) {
        const x = ex.sets[j];
        if (x.w != null || x.tag === 'backoff') break;
        if (setHasVal(x) && !x._t) continue;
        const inp = app.querySelector(`.num[data-le="${ei}"][data-ls="${j}"][data-lf="w"]`);
        if (inp) inp.placeholder = fmtIn(s.w);
      }
    }
    return;
  }
  if (t.dataset.ld === 'notes' && logDraft) { logDraft.notes = t.value; logDraft.dirty = true; return; }
  if (t.classList.contains('num') && t.dataset.f) {
    const a = db.active;
    if (!a) return;
    const ei = +t.dataset.e, si = +t.dataset.s, f = t.dataset.f;
    const ex = a.exercises[ei], s = ex && ex.sets[si];
    if (!s) return;
    s[f] = parseNum(t.value);
    if (f === 'w' && s.w != null && !s.tag) {
      for (let j = si + 1; j < ex.sets.length; j++) {
        if (ex.sets[j].w != null || ex.sets[j].tag === 'backoff') break;
        const inp = app.querySelector(`.num[data-e="${ei}"][data-s="${j}"][data-f="w"]`);
        if (inp) inp.placeholder = fmtIn(s.w);
      }
    }
    save();
    return;
  }
  if (t.dataset.bind === 'session-name') { const s = findSession(view.id); if (s) { s.name = t.value; touchProgram(); save(); } }
});
app.addEventListener('change', (e) => {
  const t = e.target;
  if (coachChange(t)) return;
  if (t.dataset.bind === 'session-plate') { const s = findSession(view.id); if (s) { s.plate = t.value; touchProgram(); save(); render(true); } return; }
  if (t.dataset.bind === 'session-name') { const s = findSession(view.id); if (s && !s.name.trim()) { s.name = 'Séance sans nom'; save(); render(true); } return; }
  if (t.dataset.change === 'progress-ex') { progressKey = t.value; render(true); return; }
  if ((t.dataset.ld === 'date' || t.dataset.ld === 'time') && logDraft) {
    const d = logDraft;
    d[t.dataset.ld] = t.value; d.dirty = true;
    /* Nouvelle séance encore vide : séance prévue ce jour-là et séries de la phase de cette date */
    if (t.dataset.ld === 'date' && !d.id && !d.typed && !d.shaped && isIsoDay(t.value)) {
      const s = (d.sessionAuto && pickable(plannedSession(t.value))) || findSession(d.sessionId);
      if (s) { setDraftSession(d, s); render(true); return; }
    }
    const box = $('[data-lweek]'); if (box) box.innerHTML = draftInfoHTML(d);
    return;
  }
  const ps = t.dataset.pset;
  if (ps === 'crossWeek') { const w = programWeek(); if (w >= 1) { if (t.value === db.program.crossDefault) delete db.program.crossWeeks[w]; else db.program.crossWeeks[w] = t.value; touchProgram(); save(true); render(true); toast(`Cross de la S${w}${NB}: ${t.value === 'mer' ? 'mercredi' : 'jeudi'}`); } return; }
  if (ps === 'crossDefault') { db.program.crossDefault = t.value === 'jeu' ? 'jeu' : 'mer'; touchProgram(); save(true); render(true); return; }
  if (ps === 'startWeight') { const v = parseNum(t.value); if (v) { db.program.startWeight = v; touchProgram(); save(true); toast('Poids de départ enregistré'); } return; }
  if (ps === 'startDate') {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.value)) return;
    const mon = isoDay(weekStart(parseIso(t.value)));
    db.program.startDate = mon; touchProgram(); save(true); render(true);
    toast(mon !== t.value ? `Début ramené au lundi ${fmtDay(parseIso(mon))}` : 'Date de début enregistrée');
    return;
  }
  if (t.name === 'unit') { db.settings.unit = t.value; touchSettings(); save(); render(true); return; }
  if (t.id === 'f-sound') { db.settings.sound = t.checked; touchSettings(); save(); if (t.checked) { unlockAudio(); setTimeout(() => beep('go'), 60); } return; }
  if (t.id === 'f-import' && t.files && t.files[0]) { importFile(t.files[0]); t.value = ''; }
});
app.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.target.classList.contains('num') || e.target.classList.contains('name-input'))) { e.preventDefault(); e.target.blur(); } });
window.addEventListener('hashchange', (e) => {
  navs++;
  fromHash = '#' + (String(e.oldURL || '').split('#')[1] || '/');
  closeSheet();
  const doit = () => { render(); window.scrollTo(0, 0); };
  if (document.startViewTransition && !reduceMotion()) {
    try { const vt = document.startViewTransition(doit); [vt.ready, vt.finished, vt.updateCallbackDone].forEach((pr) => pr && pr.catch(() => {})); } catch (e) { doit(); }
  } else doit();
});
window.addEventListener('pagehide', write);
window.addEventListener('online', () => { if (syncCfg && (syncCfg.dirty || syncCfg.errKind === 'network')) scheduleSync(800); coachPumpAll(true); });
let renderedDay = isoDay();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { write(); return; }
  keepAwake(); tick();
  if (renderedDay !== isoDay() && view.name !== 'workout' && !sheet.open) { renderedDay = isoDay(); render(true); }
  if (syncCfg && (syncCfg.dirty || syncCfg.errKind === 'network' || Date.now() - (syncCfg.lastSyncAt || 0) > 15 * 60e3)) scheduleSync(800);
  coachPumpAll(true);
});
function tick() {
  if (!db.active) return;
  const el = document.getElementById('elapsed');
  if (el) el.textContent = fmtElapsed((Date.now() - db.active.startedAt) / 1000);
  if (db.active.timer) timerUI();
}

/* ============ Démarrage ============ */
db = load();
coachInit();
buildTabs();
if (!location.hash) history.replaceState(null, '', '#/');
render();
setInterval(tick, 250);
keepAwake();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* */ }
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.self === window.top) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
if (syncCfg) scheduleSync(1500);

})();
</script>
</body>
</html>
